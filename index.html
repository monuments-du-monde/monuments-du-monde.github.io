});

// Amis sur la carte : avatar et pseudo à leur position floue (environ 200 m près).
Object.assign(MapView, {
  friendMarkers: new Map(),
  updateFriends(list) {
    if (Flat.on) return Flat.updateFriends(list);
    if (!this.ready) return;
    const keep = new Set();
    for (const f of list || []) {
      keep.add(f.id);
      let mk = this.friendMarkers.get(f.id);
      if (!mk) {
        const el = document.createElement('div');
        el.className = 'fmark';
        el.innerHTML = `<img src="${drawAvatar(f.avatar, 64)}" alt=""><span>${esc(f.pseudo)}</span>`;
        el.addEventListener('click', () => Social.openPlayer(f.id));
        mk = new maplibregl.Marker({element: el, anchor: 'bottom'}).setLngLat([f.lng, f.lat]).addTo(this.map);
        this.friendMarkers.set(f.id, mk);
      } else mk.setLngLat([f.lng, f.lat]);
    }
    for (const [id, mk] of this.friendMarkers) if (!keep.has(id)) { mk.remove(); this.friendMarkers.delete(id); }
  },
});

/* ===================== Notifications sur le téléphone (push) ===================== */
// Le téléphone s'abonne auprès de son navigateur ; le serveur envoie ensuite les alertes même jeu fermé.
// Sur iPhone, il faut d'abord installer le jeu sur l'écran d'accueil (iOS 16.4 ou plus récent).
const Push = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  state() {
    if (!this.supported()) return IS_IOS && !isStandalone() ? 'install' : 'unsupported';
    if (Notification.permission === 'denied') return 'denied';
    return S.pushOn && Notification.permission === 'granted' ? 'on' : 'off';
  },
  key() {
    const b = atob(CONFIG.PUSH.publicKey.replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(b, ch => ch.charCodeAt(0));
  },
  // À appeler pendant un geste du joueur (le navigateur demande l'autorisation).
  async enable() {
    if (!Net.profile) { Social.openAccount(); return false; }
    try {
      if ((await Notification.requestPermission()) !== 'granted') { toast(t('push_denied'), 4000); return false; }
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: this.key()});
      await Net.rpc('save_push', {p_sub: sub.toJSON(), p_lang: LANG});
      S.pushOn = true; save(); toast(t('push_on'));
      return true;
    } catch (e) { console.warn('push', e); toast(t('push_fail'), 4000); return false; }
  },
  async disable() {
    S.pushOn = false; save();
    try {
      const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
      if (sub) { await Net.rpc('delete_push', {p_endpoint: sub.endpoint}).catch(() => {}); await sub.unsubscribe(); }
    } catch (e) { console.warn('push', e); }
    toast(t('push_off'));
  },
  // À chaque connexion : l'adresse d'envoi peut changer, on la renvoie au serveur.
  async sync() {
    if (this.state() !== 'on') return;
    try {
      const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
      if (sub) await Net.rpc('save_push', {p_sub: sub.toJSON(), p_lang: LANG});
      else { S.pushOn = false; save(); }
    } catch (e) { console.warn('push', e); }
  },
  // Proposé au bon moment (profil créé, demande d'ami, message reçu) : deux fois au plus, jamais deux fois le même jour.
  ask(force) {
    const st = this.state();
    if (!Net.profile || st === 'on' || st === 'unsupported') return;
    if (!force && ((S.pushAsked || 0) >= 2 || Date.now() - (S.pushAskedAt || 0) < 864e5)) return;
    if (document.querySelector('.modal.on')) return;  // pas par-dessus une autre fenêtre
    S.pushAsked = (S.pushAsked || 0) + 1; S.pushAskedAt = Date.now(); save();
    $('#pp-text').textContent = t(st === 'install' ? 'pp_install' : st === 'denied' ? (IS_IOS ? 'pp_denied_ios' : 'pp_denied') : (IS_IOS ? 'pp_text_ios' : 'pp_text'));
    $('#pp-enable').textContent = t(st === 'install' ? 'pp_how' : 'pp_enable');
    $('#pp-enable').classList.toggle('hidden', st === 'denied');
    openModal('m-push');
  },
  renderSetting() {
    const st = this.state(), row = $('#s-push-row');
    row.classList.toggle('hidden', !Net.profile);
    $('#s-push').checked = st === 'on';
    $('#s-push').disabled = st === 'install' || st === 'unsupported' || st === 'denied';
    $('#s-push-hint').textContent = {install: t('push_install'), unsupported: t('push_unsup'), denied: t('push_blocked')}[st] || '';
  },
};

/* ===================== Bourse aux cartes (en pièces du jeu) ===================== */
// Prix proposés par défaut selon la rareté ; la bourse garde 5 % de chaque vente.
const MARKET_PRICE = {C: 30, U: 80, R: 250, E: 800, L: 2500};
const MARKET_FEE = 0.05;
const photoUrl = path => path ? `${CONFIG.SUPABASE.url}/storage/v1/object/public/cards/${path.split('/').map(encodeURIComponent).join('/')}` : '';
const Market = {
  seg: 'buy', rar: '', q: '', list: [], current: null, poll: null,
  async render() {
    const el = $('#mk-body');
    if (!Net.profile) { el.innerHTML = needAccount('mk_need'); return; }
    el.innerHTML = `<div class="row" style="align-items:center;margin-bottom:10px"><span class="small muted" style="flex:1">${esc(t('mk_sub'))}</span><span class="pill" id="mk-coins">${fmt(S.coins)} 🪙</span></div>
      <div class="seg"><button data-mact="seg" data-v="buy" class="${this.seg === 'buy' ? 'on' : ''}">${esc(t('mk_buy'))}</button><button data-mact="seg" data-v="mine" class="${this.seg === 'mine' ? 'on' : ''}">${esc(t('mk_mine'))}</button></div>
      ${this.seg === 'buy' ? `<div class="filters"><select id="mk-rar"><option value="">${esc(t('f_rar'))}</option>${RARITY_KEYS.map(k => `<option value="${k}" ${this.rar === k ? 'selected' : ''}>${esc(t('r_' + k))}</option>`).join('')}</select>
        <input id="mk-q" type="search" placeholder="${esc(t('mk_search'))}" value="${esc(this.q)}" style="flex:1;min-width:0"></div>`
        : `<button class="btn gold block" data-mact="sell-pick" style="margin-bottom:12px">${esc(t('mk_sell'))}</button>`}
      <div id="mk-list"><p class="muted">…</p></div>`;
    await this.load();
  },
  async load() {
    const r = this.rar && RARITY[this.rar], next = r && RARITY_KEYS[RARITY_KEYS.indexOf(this.rar) + 1];
    try {
      this.list = await Net.rpc('market_browse', {p_min: r ? r.min : 0, p_max: next ? RARITY[next].min - 1 : 100000, p_search: this.q || null, p_mine: this.seg === 'mine'});
    } catch (e) { $('#mk-list').innerHTML = `<p class="muted">${esc(netErr(e))}</p>`; return; }
    $('#mk-list').innerHTML = this.list.length ? `<div class="mk-grid">${this.list.map(l => this.cardHTML(l)).join('')}</div>`
      : `<p class="muted">${esc(t(this.seg === 'mine' ? 'mk_none_mine' : 'mk_none'))}</p>`;
  },
  cardHTML(l) {
    const r = rarityOf(l.links);
    return `<button class="mk-card ${r}" data-mact="open" data-id="${l.id}"><img src="${esc(photoUrl(l.photo))}" alt="" loading="lazy">
      <span class="badge-r ${r}">${RARITY[r].icon} ${esc(t('r_' + r))}</span>
      <span class="mk-info"><b>${esc(capFirst(l.name || l.monument_id))}</b>
      <span class="mk-price">${fmt(l.price)} 🪙</span>
      <span class="small muted mk-seller">${avImg(l.avatar, 18)} ${esc(l.mine ? t('mk_you') : l.pseudo)}${l.talk ? ` · 💬 ${l.talk}` : ''}</span></span></button>`;
  },
  async open(l) {
    this.current = l;
    const r = rarityOf(l.links), own = l.owned && !l.mine, afford = S.coins >= l.price;
    $('#listing-body').innerHTML = `<img class="mk-photo" src="${esc(photoUrl(l.photo))}" alt="">
      <span class="badge-r ${r}">${RARITY[r].icon} ${esc(t('r_' + r))} · ${fmt(RARITY[r].pts)} ${esc(t('pts'))}</span>
      <h2 style="margin:6px 0 2px">${esc(capFirst(l.name || l.monument_id))}</h2>
      <div class="prow" data-sact="player" data-id="${l.seller}">${avImg(l.avatar, 32)}<span class="grow"><span class="small muted">${esc(t('mk_seller'))}</span><b>${esc(l.pseudo)}</b></span></div>
      <div class="row" style="align-items:center;margin:10px 0"><b style="font-size:22px;flex:1">${fmt(l.price)} 🪙</b>
        <button class="btn sm" data-sact="focus" data-id="${l.monument_id}" data-lat="${l.lat}" data-lng="${l.lng}">🗺️ ${esc(t('mk_map'))}</button></div>
      ${l.mine ? `<button class="btn danger block" data-mact="cancel">${esc(t('mk_cancel'))}</button>`
        : own ? `<p class="muted">${esc(t('e_deja_possedee'))}</p>`
        : `<button class="btn gold block" data-mact="buy" ${afford ? '' : 'disabled'}>${esc(t('mk_buy_for', {p: fmt(l.price)}))}</button>${afford ? '' : `<p class="small muted">${esc(t('e_pieces_insuffisantes'))}</p>`}`}
      <h3>💬 ${esc(t('mk_talk'))}</h3><div id="thread"><p class="muted">…</p></div>
      <div class="row" style="margin-top:8px"><input id="thread-in" maxlength="500" placeholder="${esc(t('mk_talk_ph'))}" style="flex:1;min-width:0"><button class="btn primary" data-mact="say">${esc(t('chat_send'))}</button></div>
      <p class="small muted">${esc(t('mk_public'))}</p>`;
    openModal('m-listing');
    this.thread();
  },
  async thread() {
    if (!this.current) return;
    try {
      const msgs = await Net.rpc('listing_thread', {p_listing: this.current.id});
      $('#thread').innerHTML = msgs.length ? msgs.map(m => `<div class="msg"><span class="small"><b>${esc(m.pseudo)}</b>${m.seller ? ` <span class="badge-r L">${esc(t('mk_seller'))}</span>` : ''} · <span class="muted">${esc(ago(m.at))}</span></span><div>${esc(m.body)}</div></div>`).join('')
        : `<p class="small muted">${esc(t('mk_talk_none'))}</p>`;
    } catch (e) { $('#thread').innerHTML = `<p class="muted">${esc(netErr(e))}</p>`; }
  },
  async say() {
    const v = $('#thread-in').value.trim();
    if (!v || !this.current) return;
    try { await Net.rpc('send_message', {p_body: v, p_listing: this.current.id}); $('#thread-in').value = ''; this.thread(); }
    catch (e) { toast(netErr(e)); }
  },
  async buy() {
    const l = this.current;
    if (!l || !confirm(t('mk_confirm', {n: capFirst(l.name), p: fmt(l.price)}))) return;
    try {
      const r = await Net.rpc('market_buy', {p_id: l.id});
      S.coins = r.coins;
      // La carte achetée rejoint la collection, avec la photo du vendeur.
      const m = Mons.get(r.monument);
      S.cards[r.monument] = {at: Date.now(), pts: 0, dist: 0, acc: 0, bonus: null, cover: 'main', bought: true,
        m: m ? snapshot(m) : {lat: r.lat, lng: r.lng, l: r.links, cc: 'FR', n: {fr: r.name, en: r.name}}};
      save();
      try { const b = await (await fetch(photoUrl(r.photo))).blob(); await DB.put('photos', r.monument, b); Photos.drop(r.monument); } catch (e) { console.warn('photo', e); }
      closeModal('m-listing'); sound('win'); toast(t('mk_bought', {n: capFirst(r.name)}), 3500);
      UI.refreshAll(); MapView.scheduleRender(); this.render();
    } catch (e) { toast(netErr(e), 3500); this.load(); }
  },
  async cancel() {
    try { await Net.rpc('market_cancel', {p_id: this.current.id}); closeModal('m-listing'); toast(t('mk_cancelled')); this.render(); }
    catch (e) { toast(netErr(e)); }
  },
  async sellPick() {
    $('#sell-body').innerHTML = '<p class="muted">…</p>'; openModal('m-sell');
    try {
      const cards = await Net.rpc('market_mine');
      $('#sell-body').innerHTML = `<p class="small muted">${esc(t('mk_sell_sub'))}</p>` + (cards.length ? cards.map(c => {
        const r = rarityOf(c.links);
        return `<div class="prow" data-mact="sell" data-id="${c.id}" data-l="${c.links}" data-n="${esc(c.name || c.id)}"><span class="badge-r ${r}">${RARITY[r].icon}</span><span class="grow"><b>${esc(capFirst(c.name || c.id))}</b><span class="small muted">${esc(t('r_' + r))} · ${esc(t('mk_suggest', {p: fmt(MARKET_PRICE[r])}))}</span></span></div>`;
      }).join('') : `<p class="muted">${esc(t('mk_sell_none'))}</p>`);
    } catch (e) { $('#sell-body').innerHTML = `<p class="muted">${esc(netErr(e))}</p>`; }
  },
  async sell(id, links, name) {
    const r = rarityOf(+links), ans = prompt(t('mk_price_q', {n: capFirst(name), f: Math.round(MARKET_FEE * 100)}), MARKET_PRICE[r]);
    if (ans === null) return;
    const price = Math.round(+String(ans).replace(/\s/g, ''));
    if (!(price >= 10 && price <= 50000)) { toast(t('e_prix_invalide')); return; }
    try {
      // La photo de la carte part avec l'annonce : envoyée maintenant si elle ne l'a pas encore été.
      try { await Net.uploadPhoto(id); } catch (e) { console.warn('photo', e.message); }
      await Net.rpc('market_sell', {p_monument: id, p_price: price});
      closeModal('m-sell'); toast(t('mk_listed', {p: fmt(price)}), 3000);
      this.seg = 'mine'; this.render();
    } catch (e) { toast(netErr(e), 3500); }
  },
  act(a, el) {
    switch (a) {
      case 'seg': this.seg = el.dataset.v; this.render(); break;
      case 'open': { const l = this.list.find(x => String(x.id) === el.dataset.id); if (l) this.open(l); break; }
      case 'buy': this.buy(); break;
      case 'cancel': this.cancel(); break;
      case 'say': this.say(); break;
      case 'sell-pick': this.sellPick(); break;
      case 'sell': this.sell(el.dataset.id, el.dataset.l, el.dataset.n); break;
    }
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-mact]'); if (el && !el.disabled) Market.act(el.dataset.mact, el); });
document.addEventListener('change', e => {
  if (e.target.id === 'mk-rar') { Market.rar = e.target.value; Market.load(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'mk-q') { Market.q = e.target.value.trim(); Market.load(); }
  if (e.target.id === 'thread-in') Market.say();

});

/* ===================== Messages privés entre amis ===================== */
const Chat = {
  with: null, timer: null,
  async openList() {
    $('#chats-body').innerHTML = '<p class="muted">…</p>'; openModal('m-chats');
    try {
      const list = await Net.rpc('conversations');
      $('#chats-body').innerHTML = list.length ? list.map(c => `<div class="prow" data-sact="chat" data-id="${c.id}" data-p="${esc(c.pseudo)}">${avImg(c.avatar, 40)}
        <span class="grow"><b>${esc(c.pseudo)}</b><span class="small muted" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.body)}</span></span>
        ${c.unread ? `<span class="nbadge" style="position:static">${c.unread}</span>` : `<span class="small muted">${esc(ago(c.at))}</span>`}</div>`).join('')
        : `<p class="muted">${esc(t('chat_none'))}</p>`;
    } catch (e) { $('#chats-body').innerHTML = `<p class="muted">${esc(netErr(e))}</p>`; }
  },
  async open(id, pseudo) {
    closeModal('m-chats'); closeModal('m-player');
    this.with = {id, pseudo};
    $('#chat-title').textContent = pseudo;
    $('#chat-log').innerHTML = '<p class="muted">…</p>';
    openModal('m-chat');
    await this.load();
    clearInterval(this.timer);
    this.timer = setInterval(() => { if ($('#m-chat').classList.contains('on')) this.load(); else clearInterval(this.timer); }, 4000);
    $('#chat-in').focus();
  },
  async load() {
    if (!this.with) return;
    try {
      const msgs = await Net.rpc('messages_with', {p_user: this.with.id});
      const log = $('#chat-log'), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
      log.innerHTML = msgs.length ? msgs.map(m => `<div class="bubble ${m.mine ? 'mine' : ''}">${esc(m.body)}<span>${esc(ago(m.at))}</span></div>`).join('')
        : `<p class="small muted">${esc(t('chat_first', {p: this.with.pseudo}))}</p>`;
      if (atEnd) log.scrollTop = log.scrollHeight;
    } catch (e) { $('#chat-log').innerHTML = `<p class="muted">${esc(netErr(e))}</p>`; }
  },
  async send() {
    const v = $('#chat-in').value.trim();
    if (!v || !this.with) return;
    $('#chat-in').value = '';
    try { await Net.rpc('send_message', {p_body: v, p_to: this.with.id}); await this.load(); const log = $('#chat-log'); log.scrollTop = log.scrollHeight; }
    catch (e) { $('#chat-in').value = v; toast(netErr(e)); }
  },
  async report() {
    if (!this.with) return;
    const why = (prompt(t('chat_report_q', {p: this.with.pseudo})) || '').trim();
    if (!why) return;
    try { await Net.rpc('report_user', {p_user: this.with.id, p_reason: why}); Notify.send('report', '🚩 Nouveau signalement à traiter'); toast(t('chat_reported')); } catch (e) { toast(netErr(e)); }
  },
  async block() {
    if (!this.with || !confirm(t('chat_block_q', {p: this.with.pseudo}))) return;
    try { await Net.rpc('block_user', {p_user: this.with.id, p_on: true}); closeModal('m-chat'); toast(t('chat_blocked')); } catch (e) { toast(netErr(e)); }
  },
};

/* ===================== Sauvegarde en ligne ===================== */
// La partie est copiée sur le serveur ; le code de récupération rend le compte sur un autre téléphone. Les photos restent sur l'appareil.
window.Cloud = {
  ALPHA: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', KEY: 'mdm_code', timer: null, busy: false, off: false, at: 0,
  touch() {
    if (this.off || !Net.profile) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 20000);
  },
  async push() {
    clearTimeout(this.timer); this.timer = null;
    if (this.off || this.busy || !Net.profile || !navigator.onLine) return;
    this.busy = true;
    try { await Net.rpc('save_put', {p_state: S}); this.at = Date.now(); this.status(); }
    catch (e) { console.warn('cloud', e.message); }
    this.busy = false;
  },
  status() {
    const el = $('#cloud-status');
    if (el) el.textContent = this.at ? t('cloud_ok', {h: new Date(this.at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}) : t(Net.profile ? 'cloud_wait' : 'cloud_need');
  },
  make() {
    return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => this.ALPHA[b % 32]).join('');
  },
  pretty: code => code.match(/.{4}/g).join('-'),
  async login(code) {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40) + '@joueurs.invalid';
  },
  // Crée le code au premier appui, puis le réaffiche.
  async show() {
    if (!Net.profile) return toast(t('cloud_need'));
    let code = null;
    try { code = localStorage.getItem(this.KEY); } catch (e) {}
    if (!code) {
      code = this.make();
      try { await Net.rpc('recovery_set', {p_login: await this.login(code), p_secret: code}); }
      catch (e) { return toast(t('cloud_fail')); }
      try { localStorage.setItem(this.KEY, code); } catch (e) {}
      await this.push();
    }
    prompt(t('cloud_code_p'), this.pretty(code));
  },
  async restore() {
    const raw = prompt(t('cloud_ask'));
    if (!raw) return;
    const code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 20) return toast(t('cloud_bad'));
    if (!confirm(t('cloud_confirm'))) return;
    try {
      Net.store(await Net.auth('token?grant_type=password', {email: await this.login(code), password: code}));
      this.off = true; clearTimeout(this.timer);  // l'ancienne partie de cet appareil ne doit plus être envoyée
      const r = await Net.rpc('save_get');
      if (r && r.state) { localStorage.setItem(LS_KEY, JSON.stringify(r.state)); S = loadState(); }
      localStorage.setItem(this.KEY, code);
      location.reload();
    } catch (e) { this.off = false; toast(t(e.status === 400 ? 'cloud_bad' : 'cloud_fail')); }
  },
};

const Shop = {
  async sha256(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s.trim().toUpperCase()));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  },
  async unlock(code) {
    if (!code || !code.trim()) return false;
    if (!window.crypto || !crypto.subtle) { toast(t('https')); return false; }
    const h = await this.sha256(code);
    const pid = Object.keys(CONFIG.SHOP).find(p => (CONFIG.SHOP[p].codeHashes || []).map(x => x.toLowerCase()).includes(h));
    if (!pid) { toast(t('code_bad')); return false; }
    S.products[pid] = Date.now();
    if (has('pass')) this.daily(true);
    save();
    if (noAds()) Ads.removeBanners();
    UI.refreshAll(); this.applyTheme(); sound('win');
    toast(t('code_ok', {p: t(OFFERS.find(o => o.id === pid).name)}));
    return true;
  },
  daily(force) {
    if (Net.sess) { Net.daily(); return; }  // compte en ligne : bonus donné par le serveur
    if (S.lastDaily === today() && !force) return;
    if (S.lastDaily !== today()) {
      S.lastDaily = today();
      const c = has('pass') ? 40 : 20;
      S.coins += c; if (has('pass')) S.boostX2++;
      save(); setTimeout(() => toast(t('daily', {c})), 1200);
    }
  },
  async buyWithCoins(kind, id) {
    const it = (kind === 'frame' ? FRAMES : THEMES).find(x => x.id === id);
    if (!it || !it.coins || owns(kind, it)) return;
    if (S.coins < it.coins) { toast(t('not_enough')); return; }
    if (Net.profile) {
      try { S.coins = await Net.rpc('wallet_spend', {p_coins: it.coins, p_item: kind + ':' + id}); } catch (e) { toast(netErr(e)); return; }
    } else S.coins -= it.coins;
    S.unlocked.push(kind + ':' + id); S.equip[kind] = id;
    save(); this.applyTheme(); UI.refreshAll(); sound('coin'); toast(t('bought'));
  },
  equip(kind, id) {
    const it = (kind === 'frame' ? FRAMES : THEMES).find(x => x.id === id);
    if (!it || !owns(kind, it)) return;
    S.equip[kind] = id; save(); this.applyTheme(); UI.refreshAll();
  },
  applyTheme() {
    const th = THEMES.find(x => x.id === S.equip.theme);
    const id = th && owns('theme', th) ? th.id : 'night';
    document.documentElement.dataset.theme = id;
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff';
  },
};

const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function exportSave() {
  const photos = {};
  for (const k of await DB.keys('photos')) { const b = await DB.get('photos', k); if (b) photos[k] = await blobToDataURL(b); }
  const blob = new Blob([JSON.stringify({app: 'monuments-du-monde', v: 2, at: Date.now(), state: S, photos})], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `monuments-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importSave(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'monuments-du-monde' || !data.state) throw new Error('format');
    if (!confirm(t('import_confirm'))) return;
    await DB.clear('photos');
    for (const [k, u] of Object.entries(data.photos || {})) await DB.put('photos', k, await (await fetch(u)).blob());
    Photos.reset();
    const keepProducts = S.products;
    S = {...loadState(), ...data.state, products: {...data.state.products, ...keepProducts}}; save();
    Shop.applyTheme(); MapView.refreshAll(); MapView.scheduleRender(); UI.refreshAll(); UI.renderProfile(); toast(t('import_ok'));
  } catch (e) { toast(t('import_bad')); }
}
async function resetGame() {
  if (!confirm(t('reset_c1')) || !confirm(t('reset_c2'))) return;
  const keep = {products: S.products, unlocked: S.unlocked, equip: S.equip, settings: S.settings, onboarded: true, lastDaily: S.lastDaily, ads: S.ads};
  await DB.clear('photos').catch(() => {});

}

  if (!confirm(t('del_c1')) || !confirm(t('del_c2'))) return;

  try {
    const headers = {apikey: c.anonKey, Authorization: 'Bearer ' + await Net.token(), 'Content-Type': 'application/json'}, uid = Net.uid();
    const list = await (await fetch(`${c.url}/storage/v1/object/list/cards`, {method: 'POST', headers, body: JSON.stringify({prefix: uid, limit: 1000})})).json();

  Cloud.off = true; clearTimeout(Cloud.timer);

  try { localStorage.clear(); } catch (e) {}
  location.reload();

const IN_APP = /FBAN|FBAV|FB_IAB|Instagram|Messenger|Snapchat|musical_ly|Bytedance|TikTok|Line\/|MicroMessenger|LinkedInApp|Twitter/i.test(UA);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
// Avec un profil, le lien contient le code ami : la personne invitée devient directement son amie.
const installLink = () => new URL('installer/' + (Net.profile ? '?ami=' + Net.profile.invite_code : ''), location.origin + location.pathname).href;
const SHARE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; Install.refresh(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast(t('install_done')); Install.refresh(); });

const Install = {
  fromBoot: false,
  open(fromBoot = false) { this.fromBoot = fromBoot; this.render(); openModal('m-install'); },
  refresh() { if ($('#m-install').classList.contains('on')) this.render(); },
  close() {
    closeModal('m-install');
    if (location.search) history.replaceState(null, '', location.pathname);
    if (!this.fromBoot) return;
    this.fromBoot = false;
    if (!S.onboarded) openModal('m-intro'); else Geo.start();
  },
  steps: items => `<ol class="inst-steps">${items.map(s => `<li>${s}</li>`).join('')}</ol>`,
  render() {
    const copy = `<button class="btn block" data-act="copy-link">${esc(t('inst_copy'))}</button>`;
    let html;
    if (isStandalone()) html = `<p>${esc(t('install_already'))}</p>`;
    else if (IN_APP) {
      // Bouton qui tente d'ouvrir le vrai navigateur ; les étapes manuelles restent affichées s'il ne marche pas.
      const link = installLink();
      const open = IS_ANDROID ? `intent://${link.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`
        : IS_IOS ? 'x-safari-' + link : '';
      html = `<p class="inst-warn">${esc(t('inst_inapp'))}</p>`
        + (open ? `<a class="btn primary block big" href="${esc(open)}">${esc(t(IS_IOS ? 'inst_open_safari' : 'inst_open_chrome'))}</a>` : '')
        + this.steps([t('inst_inapp_1'), t('inst_inapp_2')]) + copy;
    } else if (deferredInstall) html = `<button class="btn primary block big" data-act="do-install">${esc(t('install_btn'))}</button>`;
    else if (IS_IOS) {
      html = this.steps([
        `${t('inst_ios_1')} <span class="inst-ico">${SHARE_ICON}</span> <span class="small muted">${t('inst_ios_1b')}</span>`,
        `${t('inst_ios_2')} <span class="inst-ico">➕</span>`,
        t('inst_ios_3'),
      ]);
    } else if (IS_ANDROID) html = this.steps([t('inst_and_1'), t('inst_and_2')]);
    else html = `<p>${esc(t('inst_desktop'))}</p>` + copy;
    $('#inst-body').innerHTML = html;
  },
  async prompt() {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice.catch(() => {});
    deferredInstall = null;
    this.render();
  },
};
async function copyLink(url = installLink()) {
  try { await navigator.clipboard.writeText(url); toast(t('inst_copied')); } catch (e) { prompt(t('inst_copy'), url); }
}
async function invite() {
  const url = installLink();
  if (!navigator.share) return copyLink(url);
  try { await navigator.share({title: t('app'), text: t('invite_text'), url}); } catch (e) { /* partage annulé */ }
}

/* ===================== Événements ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tab],[data-close]');
  if (!el) return;
  if (el.dataset.tab) return UI.tab(el.dataset.tab);
  if (el.hasAttribute('data-close')) return el.closest('.modal').classList.remove('on');
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'photo': closeModal('m-detail'); MapView.closePopup(); Cam.open(id); break;
    case 'detail': MapView.closePopup(); showDetail(id); break;
    case 'focus': MapView.focus(id); break;
    case 'share': shareCard(id); break;
    case 'close-reveal': closeModal('m-reveal'); Ads.maybeInterstitial(); Social.maybeAsk(); break;
    case 'do-install': Install.prompt(); break;
    case 'copy-link': copyLink(); break;
    case 'equip': Shop.equip(el.dataset.kind, id); break;
    case 'coins': Shop.buyWithCoins(el.dataset.kind, id); break;
    case 'cover':
      if (S.cards[id] && (el.dataset.v === 'main' || S.cards[id].bonus)) {
        S.cards[id].cover = el.dataset.v; save(); toast(t('cover_ok'));
        if ($('#m-detail').classList.contains('on')) showDetail(id);
        if (UI.current === 'collection') UI.renderCollection();
      }
      break;
  }
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
  if (e.target === m && !['cam', 'm-ad', 'm-intro', 'm-install'].includes(m.id)) m.classList.remove('on');
}));
$('#btn-fab').onclick = () => Cam.open();
$('#btn-locate').onclick = () => MapView.locate();
$('#btn-orbit').onclick = () => MapView.orbit();
$('#btn-3d').onclick = () => MapView.retry();
$('#cam-close').onclick = () => Cam.close();
$('#cam-shoot').onclick = () => Cam.shoot();
$('#cam-flip').onclick = () => { Cam.facing = Cam.facing === 'environment' ? 'user' : 'environment'; Cam.startStream(); };
$('#cam-target').onchange = () => { $('#cam-verdict').classList.add('hidden'); Cam.onGeo(Geo.pos, Geo.err); };
$('#cam-file').onchange = e => { Cam.onFile(e.target.files[0]); e.target.value = ''; };
['#f-own', '#f-rar', '#f-cc'].forEach(s => { $(s).onchange = () => UI.renderCollection(); });
$('#s-sound').onchange = e => { S.settings.sound = e.target.checked; save(); };
$('#s-vibrate').onchange = e => { S.settings.vibrate = e.target.checked; save(); };
const setLang = l => { S.settings.lang = l; save(); location.reload(); };
$('#s-lang').onchange = e => setLang(e.target.value);
$('#intro-lang').onchange = e => setLang(e.target.value);
$('#btn-install').onclick = () => Install.open();
$('#btn-invite').onclick = invite;
$('#inst-x').onclick = $('#inst-later').onclick = () => Install.close();
$('#btn-export').onclick = exportSave;
$('#btn-cloud-code').onclick = () => Cloud.show();
$('#btn-cloud-restore').onclick = () => Cloud.restore();
$('#cloud-box').classList.toggle('hidden', !Net.enabled());
document.addEventListener('visibilitychange', () => { if (document.hidden && Cloud.timer) Cloud.push(); });
if (CONFIG.SUPPORT_URL) { $('#btn-support').href = CONFIG.SUPPORT_URL; $('#support-box').classList.remove('hidden'); }
$('#imp-file').onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); e.target.value = ''; };
$('#btn-reset').onclick = resetGame;
$('#btn-delete-account').onclick = deleteAccount;
$('#btn-reward').onclick = () => Ads.rewarded();
$('#btn-unlock').onclick = () => Shop.unlock($('#unlock-code').value);
$('#btn-intro').onclick = () => { S.onboarded = true; save(); closeModal('m-intro'); Geo.start(); if (S.pendingInvite) Social.maybeAsk(true); };
$('#btn-notifs').onclick = () => Social.openNotifs();
$('#btn-chats').onclick = () => Chat.openList();
$('#btn-map-retry').onclick = () => MapView.retry();
$('#s-push').onchange = e => { if (e.target.checked) Push.enable().then(ok => { e.target.checked = ok; }); else Push.disable(); };
$('#s-ghost').onchange = e => {
  const on = e.target.checked;
  Net.rpc('set_ghost', {p_on: on}).then(() => { Net.profile.ghost = on; toast(t(on ? 'ghost_on' : 'ghost_off')); })
    .catch(err => { e.target.checked = !on; toast(netErr(err)); });
};
document.addEventListener('visibilitychange', () => { if (document.hidden && $('#cam').classList.contains('on')) Cam.close(); });
let lastDataPos = null;
Geo.subs.add(pos => {
  UI.refreshNearby(); MapView.updateMe(pos);
  if (!pos) return;
  if (!lastDataPos || haversine(pos.lat, pos.lng, lastDataPos.lat, lastDataPos.lng) > 500) {
    lastDataPos = pos;
    Data.around(pos.lat, pos.lng).then(n => { if (n) { MapView.scheduleRender(); UI.refreshNearby(); } });
    if (Regions.playable(pos.lat, pos.lng)) Discover.maybe(pos.lat, pos.lng);
  }
});

/* ===================== Démarrage ===================== */
(async function boot() {
  applyI18n();
  Shop.applyTheme();
  $('#app-version').textContent = CONFIG.VERSION;
  const langOpts = Object.entries(LANG_NAMES).filter(([k]) => I18N[k]).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('#s-lang').innerHTML = langOpts; $('#s-lang').value = LANG;
  $('#intro-lang').innerHTML = langOpts; $('#intro-lang').value = LANG;
  $('#f-rar').innerHTML += Object.keys(RARITY).map(k => `<option value="${k}">${esc(t('r_' + k))}</option>`).join('');
  const params = new URLSearchParams(location.search);
  // ?installer reste dans l'adresse jusqu'à la fermeture du guide : il survit ainsi au rechargement de mise à jour.
  const unlock = params.get('unlock'), wantInstall = params.has('installer');
  // Lien d'invitation d'un ami (?ami=CODE) : gardé jusqu'à la création du profil.
  if (params.get('ami')) { S.pendingInvite = params.get('ami').slice(0, 12); save(); }
  if (unlock) history.replaceState(null, '', location.pathname + (wantInstall ? '?installer' : ''));
  if (unlock) await Shop.unlock(unlock);
  Shop.daily();
  UI.refreshHeader();
  // Lien d'installation, ou première visite sur téléphone : on propose d'abord d'installer le jeu
  // (sur iPhone, une partie commencée dans Safari ne se retrouve pas dans l'appli installée).
  if (!isStandalone() && (wantInstall || (!S.onboarded && (IS_IOS || IS_ANDROID)))) Install.open(true);
  else if (!S.onboarded) openModal('m-intro'); else Geo.start();
  Notify.visit();
  // La carte démarre tout de suite, sans attendre les monuments ni la mémoire du téléphone
  // (sur iPhone, cette mémoire peut tarder à répondre après une mise à jour ou une mise en veille).
  const regions = Regions.init();
  MapView.init(Promise.race([regions, new Promise(r => setTimeout(r, 5000))]));
  await Promise.all([Data.init(), Discover.init(), regions]);
  Net.start();
  $('#data-info').textContent = Data.index ? `${fmt(Data.index.total)} monuments (Wikidata ${Data.index.built})` : '';
  MapView.refreshData();
  if (Geo.pos) Data.around(Geo.pos.lat, Geo.pos.lng).then(n => { if (n) { MapView.scheduleRender(); UI.refreshNearby(); } });
  UI.refreshAll();
  Ads.init();
  window.addEventListener('offline', () => toast(t('offline')));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  }
})();
// Nouvelle version installée par le service worker : on recharge une fois pour que la page, les traductions
// et les données soient de la même version (sauf pendant une photo, la mise à jour attendra le prochain lancement).
if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || $('#cam').classList.contains('on')) return;
    reloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>
