<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monuments du Monde</title>
<meta name="description" content="Parcourez le monde, photographiez ses monuments et complétez votre collection de cartes.">
<!-- Aperçu des liens partagés (WhatsApp, Messages, Instagram…). Adresse absolue : à changer si le site déménage. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Monuments du Monde">
<meta property="og:title" content="Monuments du Monde">
<meta property="og:description" content="Photographiez les monuments du monde entier et collectionnez leurs cartes. Gratuit, sur téléphone.">
<meta property="og:image" content="https://monuments-du-monde.github.io/icons/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monuments">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Style « Carte vivante » : clair et lisible comme une carte routière, avec des touches de couleur de jeu. */
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--card:#ffffff;--card2:#f1f3f4;--line:#dadce0;--glass:rgba(255,255,255,.97);
  --tx:#202124;--mut:#5f6368;--acc:#1a73e8;--acc-tx:#ffffff;--tint:#e8f0fe;--tint-tx:#174ea6;--gold:#f9ab00;--gold-tx:#b06000;
  --ok:#188038;--warn:#e37400;--ko:#d93025;
  --C:#80868b;--U:#1e8e3e;--R:#1a73e8;--E:#9334e6;--L:#f9ab00;--tilebg:#e8eaed;--radius:16px;
  --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px rgba(60,64,67,.15);
}
/* Thèmes (débloqués en boutique) : variantes sombres ou colorées du même style */
[data-theme=dawn],[data-theme=forest],[data-theme=sakura],[data-theme=ocean],[data-theme=neon]{--tx:#eef2ff;--tint:rgba(255,255,255,.14);--tint-tx:#ffffff;--acc-tx:#111111;--tilebg:#00000033;--shadow:0 2px 10px rgba(0,0,0,.45)}
[data-theme=dawn]{--bg:#2a1b3d;--bg2:#36224f;--card:#46295f;--card2:#553272;--line:#6f4a90;--glass:rgba(42,27,61,.95);--mut:#d0b8e8;--acc:#ffb36b}
[data-theme=forest]{--bg:#0f2418;--bg2:#143020;--card:#1b3f2b;--card2:#224d35;--line:#2f6447;--glass:rgba(15,36,24,.95);--mut:#a7c9b2;--acc:#e0c25a}
[data-theme=parchment]{--bg:#f6ecd6;--bg2:#efe3c8;--card:#fff7e6;--card2:#f1dfb8;--line:#c9b183;--glass:rgba(250,242,224,.97);--tx:#3b2a14;--mut:#7a6342;--acc:#a8641a;--tint:#f1dfb8;--tint-tx:#3b2a14;--tilebg:#e9dcc0}
[data-theme=sakura]{--bg:#2b1420;--bg2:#3a1b2b;--card:#4a2337;--card2:#5a2b43;--line:#7a3d5c;--glass:rgba(43,20,32,.95);--mut:#f0bfd6;--acc:#ff9cc6}
[data-theme=ocean]{--bg:#04202c;--bg2:#062c3c;--card:#0a3a4f;--card2:#0d4760;--line:#14607e;--glass:rgba(4,32,44,.95);--mut:#9fd6e6;--acc:#3fe0d0}
[data-theme=neon]{--bg:#07020f;--bg2:#120626;--card:#1a0a36;--card2:#240e4a;--line:#5b1aa8;--glass:rgba(7,2,15,.95);--mut:#c6a8ff;--acc:#39ff14}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 Roboto,system-ui,-apple-system,"Segoe UI","Hiragino Sans","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--acc)}
h2{font-size:22px;font-weight:400;margin:4px 0 12px}
h3{font-size:16px;font-weight:500;margin:20px 0 8px}
b,strong{font-weight:500}
.muted{color:var(--mut)}
.small{font-size:13px}
.hidden{display:none!important}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.brand{font-weight:500;font-size:17px;flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand img{width:26px;height:26px;border-radius:7px;flex:none}
.pill{background:var(--card2);border-radius:16px;padding:5px 10px;font-weight:500;font-size:13px;white-space:nowrap}
.pill.gold{background:#fef7e0;color:var(--gold-tx)}
[data-theme=dawn] .pill.gold,[data-theme=forest] .pill.gold,[data-theme=sakura] .pill.gold,[data-theme=ocean] .pill.gold,[data-theme=neon] .pill.gold{background:var(--card2);color:var(--acc)}

main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:16px 16px 28px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.view.on{display:block}
.wrap{max-width:920px;margin:0 auto}
#view-map{padding:0;overflow:hidden}
#map{position:absolute;inset:0;background:#f2efe9}
#map-list{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 140px}
/* Carte 2D de secours (téléphones sans 3D) */
#map2d{position:absolute;inset:0;z-index:0;background:#f2efe9}
#map2d .leaflet-bar{border:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
#map2d .leaflet-bar a{width:36px;height:36px;line-height:36px;color:#3c4043}
#map2d .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)}
.pop2d .leaflet-popup-content-wrapper{background:var(--bg);color:var(--tx);border-radius:16px;box-shadow:var(--shadow)}
.pop2d .leaflet-popup-content{margin:14px 16px;min-width:220px;font:inherit}
.pop2d .leaflet-popup-tip-container{display:none}
.pop2d a.leaflet-popup-close-button{color:var(--mut);font-size:22px;width:30px;height:30px}
.mk2d{background:none;border:0}
.pin2d img{position:relative;display:block;width:28px;height:38px}
.art2d img{display:block;image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.halo2d{position:absolute;left:14px;top:38px;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid var(--c);animation:halo2d 1.9s ease-out infinite;pointer-events:none}
@keyframes halo2d{from{transform:scale(.5);opacity:.85}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.halo2d{animation:none;opacity:.5}}

nav.tabs{display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:2px 0;font-weight:500;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
nav.tabs button .i{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--tint-tx);font-weight:700}
nav.tabs button.on .i{background:var(--tint)}
@media (min-width:900px){nav.tabs{justify-content:center}nav.tabs button{flex:0 0 140px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 18px;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;color:var(--acc);min-height:40px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#202124}
.btn.danger{background:#fce8e6;border-color:#f6aea9;color:#c5221f}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}

/* Carte : fenêtres d'information, pays « bientôt », boutons flottants */
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.2)}
#map .maplibregl-popup-content{background:var(--bg);color:var(--tx);border-radius:16px;padding:14px 16px;min-width:220px;box-shadow:var(--shadow)}
#map .maplibregl-popup-tip{display:none}
#map .maplibregl-popup-close-button{color:var(--mut);font-size:22px;padding:2px 8px}
.maplibregl-ctrl-top-left{top:4px}
.maplibregl-ctrl-group{border-radius:12px!important;box-shadow:var(--shadow)!important}
.soon-tag{background:rgba(255,255,255,.94);color:#3c4043;border:1px dashed #9aa0a6;border-radius:14px;padding:4px 10px;font-weight:500;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 2px rgba(60,64,67,.25)}
.pop h4{margin:6px 0 2px;font-size:18px;font-weight:500}
.chip{position:absolute;z-index:500;top:10px;right:10px;background:var(--glass);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:500;display:flex;gap:6px;align-items:center;max-width:70%;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.ko{background:var(--ko)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.locate{position:absolute;z-index:500;top:56px;right:10px;width:44px;height:44px;border-radius:22px;border:0;background:var(--glass);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.locate.orbit{top:110px}
.nearby{position:absolute;z-index:500;left:10px;right:10px;bottom:10px;max-width:560px;margin:0 auto;background:var(--glass);border-radius:20px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 12px rgba(60,64,67,.3)}
.nearby .txt{flex:1;min-width:0}
.nearby .txt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-tx);cursor:pointer;box-shadow:0 2px 6px rgba(26,115,232,.45);flex:none;display:flex;align-items:center;justify-content:center}
.fab svg.ic{width:28px;height:28px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.badge-r{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;background:#f1f3f4;color:#3c4043}
.badge-r.U{background:#e6f4ea;color:#137333}.badge-r.R{background:#e8f0fe;color:#174ea6}.badge-r.E{background:#f3e8fd;color:#7627bb}.badge-r.L{background:#fef7e0;color:#b06000}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=search],input:not([type]){background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;min-height:42px;max-width:100%}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.progress{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--acc);border-radius:4px;width:0;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* Cartes et cadres */
.tile{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--tilebg);border:3px solid var(--line);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:0;text-align:left;color:#fff;box-shadow:0 1px 3px rgba(60,64,67,.25)}
.C{--rc:var(--C)}.U{--rc:var(--U)}.R{--rc:var(--R)}.E{--rc:var(--E)}.L{--rc:var(--L)}
.tile.fr-classic,.cardbig.fr-classic{border-color:var(--rc)}
.tile.L.fr-classic,.cardbig.L.fr-classic{box-shadow:0 0 0 3px rgba(249,171,0,.25),0 2px 8px rgba(60,64,67,.3)}
.fr-bronze{border-color:#cd7f32!important}
.fr-silver{border-color:#bdc1c6!important}
.fr-gold{border-color:#f9ab00!important;box-shadow:0 0 14px rgba(249,171,0,.5)}
.fr-neon{border-color:#39ff14!important;box-shadow:0 0 12px #39ff14,inset 0 0 8px #39ff14}
.fr-vintage{border-color:#8b6b3d!important;filter:sepia(.45) contrast(1.05)}
.fr-rainbow,.fr-holo{border-color:transparent!important;background:linear-gradient(var(--tilebg),var(--tilebg)) padding-box,linear-gradient(115deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#b16cff,#ff5f6d) border-box;background-size:100% 100%,300% 300%}
.fr-holo{background:linear-gradient(var(--tilebg),var(--tilebg)) padding-box,linear-gradient(115deg,#ff6ad5,#c774e8,#ad8cff,#8795e8,#94d0ff,#ff6ad5) border-box;background-size:100% 100%,300% 300%;animation:holo 4s linear infinite}
.fr-holo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,rgba(180,140,255,.2) 55%,transparent 70%);background-size:250% 250%;animation:holo 3s linear infinite;pointer-events:none}
@keyframes holo{to{background-position:0 0,300% 0}}
.tile.locked{filter:saturate(.3);border-color:var(--line)!important;box-shadow:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:50px;color:#9aa0a6;font-weight:300}
.tile .cap{position:relative;padding:28px 9px 9px;background:linear-gradient(transparent,rgba(32,33,36,.85))}
.tile .cap b{display:block;font-size:13px;line-height:1.2;font-weight:500}
.tile .cap span{font-size:11px;color:#e8eaed}
.tile .star{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.95);color:#3c4043;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;z-index:1}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:12px 14px}
.stat:nth-child(4n+1){background:#e8f0fe}.stat:nth-child(4n+2){background:#fef7e0}.stat:nth-child(4n+3){background:#e6f4ea}.stat:nth-child(4n+4){background:#fce8f3}
[data-theme=dawn] .stat,[data-theme=forest] .stat,[data-theme=sakura] .stat,[data-theme=ocean] .stat,[data-theme=neon] .stat{background:var(--card2)!important}
.stat b{display:block;font-size:24px;font-weight:500}
.stat span{font-size:13px;color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-size:12px}
.bdg .e{font-size:28px;display:block}
.bdg.off{opacity:.35;filter:grayscale(1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}

/* Boutique */
.offer{position:relative;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;background:var(--card)}
.offer.hero{background:#fef7e0;border:2px solid var(--gold);color:#202124}
.offer.hero .muted{color:#5f6368}
.offer ul{padding-left:20px;margin:8px 0}
.offer .ribbon{position:absolute;top:-11px;right:14px;background:var(--gold);color:#202124;font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px}
.price{font-size:24px;font-weight:500;color:var(--gold-tx)}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cos-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.cos-item.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.cos-item .tile{width:70px;cursor:default}
.swatch{width:70px;height:93px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.swatch i{flex:1}
.adslot{margin:16px 0;min-height:60px;text-align:center}

/* Fenêtres : feuille qui monte du bas, comme sur une carte routière */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(32,33,36,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;padding:26px 16px calc(18px + env(safe-area-inset-bottom,0px));position:relative;box-shadow:0 -2px 12px rgba(60,64,67,.25)}
.sheet::before{content:"";position:absolute;top:10px;left:50%;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:var(--line)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:28px}}
.x{position:absolute;top:14px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--mut);cursor:pointer;font-size:16px;z-index:2}

#cam{z-index:1100;background:#000;color:#fff}
#cam .camwrap{position:absolute;inset:0;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#cam .camtop{position:absolute;top:0;left:0;right:0;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(0,0,0,.7),transparent);display:flex;flex-direction:column;gap:8px}
#cam .camtop select{width:100%;max-width:520px;background:rgba(32,33,36,.85);color:#fff;border-color:rgba(255,255,255,.3);border-radius:20px}
#cam .status{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
#cam .cambot{position:absolute;bottom:0;left:0;right:0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:28px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
.shutter:active{background:#fff}
.camside{width:52px;height:52px;border-radius:50%;border:0;background:rgba(32,33,36,.6);font-size:20px;cursor:pointer;color:#fff}
#cam .fallback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#cam .verdict{position:absolute;left:12px;right:12px;bottom:130px;max-width:520px;margin:0 auto;background:#ffffff;color:#202124;border-radius:16px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.flash{position:fixed;inset:0;background:#fff;z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.9;transition:none}

.reveal{display:flex;flex-direction:column;align-items:center;text-align:center}
.cardbig{width:min(270px,72vw);aspect-ratio:3/4;border-radius:20px;border:4px solid var(--line);overflow:hidden;position:relative;background:var(--tilebg);animation:flip .9s cubic-bezier(.2,.8,.2,1.2);color:#fff;box-shadow:0 4px 16px rgba(60,64,67,.3)}
.cardbig.E.fr-classic{box-shadow:0 0 0 4px rgba(147,52,230,.2),0 6px 24px rgba(147,52,230,.35)}.cardbig.L.fr-classic{box-shadow:0 0 0 5px rgba(249,171,0,.25),0 6px 28px rgba(249,171,0,.45)}
.cardbig img{width:100%;height:100%;object-fit:cover}
.cardbig .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(32,33,36,.9));text-align:left;z-index:1}
.cardbig .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.6s .7s ease-out}
@keyframes flip{0%{transform:perspective(800px) rotateY(180deg) scale(.6);opacity:0}100%{transform:perspective(800px) rotateY(0) scale(1);opacity:1}}
@keyframes shine{to{transform:translateX(120%)}}
.pts{font-size:30px;font-weight:500;color:var(--tint-tx);background:var(--tint);border-radius:16px;padding:8px 18px;margin:14px 0 6px}
.lines{font-size:13px;color:var(--mut);margin-bottom:10px}
.story{text-align:left;font-size:14px;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;width:100%}
.detail-photos{display:flex;gap:8px;margin:10px 0}
.detail-photos figure{margin:0;flex:1;text-align:center;font-size:12px;color:var(--mut)}
.detail-photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.detail-photos img.cover{border-color:var(--acc)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#323232;color:#ffffff;padding:12px 18px;border-radius:8px;z-index:1300;opacity:0;transition:.25s;max-width:92vw;text-align:center;font-weight:500;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Albums évolutifs (collection et profil) : la couleur change avec le nombre de cartes */
.album{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);background:var(--card)}
.album .em{font-size:30px;line-height:1}
.album b{display:block;font-size:16px}
.album.t1{background:#fbeee2;border-color:#e8b88a;color:#202124}
.album.t2{background:#f1f3f4;border-color:#bdc1c6;color:#202124}
.album.t3{background:#fef7e0;border-color:#fdd663;color:#202124}
.album.t4{background:#e8f0fe;border-color:#a8c7fa;color:#202124}
.album .muted{color:inherit;opacity:.75}
/* Visée boussole dans l'appareil photo */
#cam-aim{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
#cam-aim .arrow{display:inline-block;font-size:18px;transition:transform .2s}
#cam-aim.ok{color:#81c995}#cam-aim.ko{color:#fdd663}

/* Partie sociale : profil, amis, compétition, notifications */
.hbtn{position:relative;border:0;background:transparent;color:var(--mut);border-radius:50%;width:38px;height:38px;cursor:pointer;flex:none;padding:0;display:flex;align-items:center;justify-content:center}
.hbtn:hover{background:var(--card2)}
.nbadge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--ko);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.seg{display:flex;border:1px solid #747775;border-radius:20px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;border-left:1px solid #747775;background:transparent;color:var(--tx);font-weight:500;padding:9px 6px;cursor:pointer;font-size:14px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--tint);color:var(--tint-tx)}
.av{border-radius:50%;flex:none}
.idcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.idcard .grow{flex:1;min-width:0}.idcard b{display:block;font-size:20px;font-weight:400}
.prow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.prow .grow{flex:1;min-width:0}.prow .grow>b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.me{background:var(--tint);border-color:transparent}
.rank{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--card2)}
.online{color:var(--ok);font-weight:500}
.avb{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.avb button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;background:var(--card2);padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avb button img{width:100%!important;height:100%!important}
.avb button.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(26,115,232,.3)}.avb button[disabled]{opacity:.3;cursor:not-allowed}
.fmark{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.fmark img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(60,64,67,.45)}
.fmark span{background:#fff;color:#202124;font-size:12px;font-weight:500;padding:1px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 1px 2px rgba(60,64,67,.35)}

/* Bourse aux cartes et messages */
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mk-card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--rc,var(--line));border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:var(--tx);font:inherit;box-shadow:0 1px 2px rgba(60,64,67,.2)}
.mk-card>img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--tilebg);display:block}
.mk-card .badge-r{position:absolute;top:8px;left:8px}
.mk-info{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mk-info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-price{font-weight:500;color:var(--gold-tx);font-size:16px}
.mk-seller{display:flex;align-items:center;gap:4px}
.mk-photo{width:100%;max-height:46vh;object-fit:cover;border-radius:16px;margin-bottom:8px;background:var(--tilebg)}
.msg{background:var(--card2);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.chat-log{max-height:52vh;min-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.bubble{align-self:flex-start;max-width:80%;background:var(--card2);border-radius:18px 18px 18px 4px;padding:8px 12px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--acc);color:var(--acc-tx);border-radius:18px 18px 4px 18px}
.bubble span{display:block;font-size:10px;opacity:.7;margin-top:2px}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

/* Fenêtre « Ne rate rien ! » (activation des notifications) */
.push-ico{width:72px;height:72px;border-radius:36px;background:var(--tint);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:6px auto 10px}
.push-ico svg.ic{width:36px;height:36px}

/* Guide d'installation (lien …/installer/ et bouton Installer du profil) */
.inst-head{display:flex;gap:14px;align-items:center;margin:2px 44px 6px 0}
.inst-head img{width:64px;height:64px;border-radius:16px;flex:none}
.inst-head h2{margin:0 0 2px;text-align:left}
.inst-steps{padding-left:24px;margin:14px 0}
.inst-steps li{margin:12px 0;font-size:16px}
.inst-ico{display:inline-flex;vertical-align:middle;padding:3px 6px;margin:0 2px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.inst-warn{border:1px solid var(--warn);border-radius:12px;padding:10px 12px;background:#fef7e0;color:#202124}
.btn.big{min-height:54px;font-size:17px;margin:8px 0}

/* Badge « Powered by Netlify » ajouté par l'hébergeur : il recouvrait la barre du bas et les boutons sur téléphone. */
#nl-badge-frame{display:none!important}
</style>
</head>

  const R = 6371000, toR = x => x * Math.PI / 180, dLat = toR(c - a), dLng = toR(d - b);

      const timer = setTimeout(() => { this._p = null; rej(new Error('mémoire interne muette')); }, 5000);
      r.onupgradeneeded = () => ['photos', 'mons', 'areas', 'info'].forEach(n => r.result.createObjectStore(n));

        clearTimeout(timer); this.ok = true;
        r.result.onclose = () => { this._p = null; this.ok = false; };  // connexion coupée par le système
        res(r.result);
      };
      r.onerror = () => { clearTimeout(timer); this._p = null; rej(r.error); };
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      let tr;
      try { tr = db.transaction(store, mode); } catch (e) { this._p = null; this.ok = false; return rej(e); }  // connexion périmée
      const req = fn(tr.objectStore(store));

const Photos = {

const coverKey = id => (S.cards[id] && S.cards[id].cover === 'bonus' && S.cards[id].bonus) ? id + ':bonus' : id;

/* ===================== Monuments ===================== */
// Format d'une ligne : [qid, lat, lng, nbArticles, pays, {langue: nom}]
const Mons = {
  all: new Map(), version: 0,
  addRows(rows, src) {
    let added = 0;

      const ex = this.all.get(id);
      if (ex) { ex.n = {...names, ...ex.n}; if (l > ex.l) ex.l = l; if (!ex.cc && cc) ex.cc = cc; continue; }
      this.all.set(id, {id, lat, lng, l: l || 0, cc: cc || '', n: {...names}, src});

  },

};
const mName = m => {
  const n = m.n || {}, s = n[LANG] || n.en || Object.values(n)[0] || m.id;

const mRar = m => rarityOf(m.l || 0);

const Data = {
  index: null, deg: 2, loaded: new Set(), pending: new Map(),
  async init() {
    try { const top = await getJSON(CONFIG.DATA_URL + 'top.json', 30000); Mons.addRows(top.m, 'base'); } catch (e) { console.warn('top.json', e); }
    try { this.index = await getJSON(CONFIG.DATA_URL + 'index.json', 30000); this.deg = this.index.tileDeg || 2; } catch (e) { console.warn('index.json', e); }
  },
  key(y, x) { const nx = Math.round(360 / this.deg); return `${y}_${((x % nx) + nx) % nx}`; },
  load(keys) {
    if (!this.index) return Promise.resolve(0);
    const todo = [...new Set(keys)].filter(k => this.index.tiles[k] && !this.loaded.has(k));
    return Promise.all(todo.map(k => {
      if (!this.pending.has(k)) {
        this.pending.set(k, getJSON(`${CONFIG.DATA_URL}t/${k}.json`, 30000)
          .then(j => { this.loaded.add(k); return Mons.addRows(j.m, 'base'); })
          .catch(() => 0).finally(() => this.pending.delete(k)));
      }
      return this.pending.get(k);
    })).then(ns => ns.reduce((a, b) => a + b, 0));
  },
  around(lat, lng) {
    const y = Math.floor((lat + 90) / this.deg), x = Math.floor((lng + 180) / this.deg), keys = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) keys.push(this.key(y + dy, x + dx));
    return this.load(keys);
  },
  bounds(b) {
    const y0 = Math.floor((b.getSouth() + 90) / this.deg), y1 = Math.floor((b.getNorth() + 90) / this.deg);
    const x0 = Math.floor((b.getWest() + 180) / this.deg), x1 = Math.floor((b.getEast() + 180) / this.deg);
    if ((y1 - y0 + 1) * (x1 - x0 + 1) > 36) return Promise.resolve(0);
    const keys = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) keys.push(this.key(y, x));
    return this.load(keys);
  },
};

/* Découverte en direct : Wikipédia (rapide) → filtre Wikidata (vrais monuments, rareté, pays). */
const Discover = {
  areas: [], busy: false, lastTry: 0,
  async init() {
    try { this.areas = await DB.all('areas'); Mons.addRows(await DB.all('mons'), 'disc'); } catch (e) {}
  },
  covered(lat, lng) {
    const now = Date.now();
    return this.areas.some(a => now - a.ts < (a.partial ? 864e5 : 30 * 864e5) && haversine(lat, lng, a.lat, a.lng) < a.cov * 0.7);
  },
  async maybe(lat, lng) {
    if (!CONFIG.DISCOVERY.enabled || this.busy || !navigator.onLine || this.covered(lat, lng) || Date.now() - this.lastTry < 15000) return;
    this.busy = true; this.lastTry = Date.now(); UI.discovering(true);
    try {
      const n = await this.run(lat, lng);
      if (n) { toast(t('discovered', {n})); MapView.scheduleRender(); UI.refreshNearby(); }
    } catch (e) { console.warn('discover', e); }
    finally { this.busy = false; UI.discovering(false); }
  },
  async run(lat, lng) {
    const cand = new Map(); let maxD = 0, full = false;
    for (const w of [...new Set([LANG, 'en'])]) {
      const url = `https://${w}.wikipedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${lat}|${lng}&ggsradius=10000&ggslimit=500&prop=coordinates|pageprops|description&ppprop=wikibase_item&colimit=max&format=json&formatversion=2&origin=*`;
      const j = await getJSON(url, 12000).catch(() => null);
      const pages = (j && j.query && j.query.pages) || [];
      if (pages.length >= 500) full = true;
      for (const p of pages) {
        const id = p.pageprops && p.pageprops.wikibase_item, c = p.coordinates && p.coordinates[0];
        if (!id || !c) continue;
        maxD = Math.max(maxD, haversine(lat, lng, c.lat, c.lon));
        const e = cand.get(id) || {id, lat: c.lat, lng: c.lon, n: {}, desc: ''};
        e.n[w] = p.title.replace(/\s*\([^)]*\)\s*$/, '');
        e.desc += ' ' + p.title + ' ' + (p.description || '');
        cand.set(id, e);
      }
    }
    const fresh = [...cand.values()].filter(c => !Mons.all.has(c.id));
    const rows = []; let partial = false;
    if (fresh.length) {
      const info = await this.filter(fresh.map(c => c.id));
      if (info) {
        for (const c of fresh) {
          const r = info.get(c.id); if (!r) continue;
          const names = {...c.n}; if (!names[LANG] && r.label) names[LANG] = r.label;
          rows.push([c.id, +c.lat.toFixed(5), +c.lng.toFixed(5), r.l, r.cc, names]);
        }
      } else {
        partial = true;
        for (const c of fresh) if (KEYWORDS.test(c.desc)) rows.push([c.id, +c.lat.toFixed(5), +c.lng.toFixed(5), 0, '', c.n]);
      }
    }
    const added = Mons.addRows(rows, 'disc');
    if (rows.length) await DB.putMany('mons', rows.map(r => [r[0], r])).catch(() => {});
    const area = {lat, lng, cov: full ? Math.max(maxD, 300) : 10000, ts: Date.now(), partial};
    this.areas.push(area);
    await DB.put('areas', `${lat.toFixed(3)},${lng.toFixed(3)}`, area).catch(() => {});
    return added;
  },
  // Renvoie Map(qid → {l, cc, label}) des candidats qui sont vraiment des monuments, ou null si aucun moteur ne répond.
  async filter(ids) {
    const out = new Map(), batches = [];
    for (let i = 0; i < ids.length; i += 100) batches.push(ids.slice(i, i + 100));
    // 3 lots en parallèle : assez rapide sans surcharger les serveurs publics.
    for (let i = 0; i < batches.length; i += 3) {
      const res = await Promise.all(batches.slice(i, i + 3).map(b => this.filterBatch(b, out)));
      if (res.includes(false)) return null;
    }
    return out;
  },
  async filterBatch(ids, out) {
    const q = 'PREFIX wd: <http://www.wikidata.org/entity/> PREFIX wdt: <http://www.wikidata.org/prop/direct/> PREFIX wikibase: <http://wikiba.se/ontology#> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> ' +
      `SELECT ?item (SAMPLE(?links) AS ?l) (SAMPLE(?cc) AS ?c) (SAMPLE(?lab) AS ?label) WHERE { VALUES ?item { ${ids.map(x => 'wd:' + x).join(' ')} } ` +
      `{ VALUES ?cls { ${MONUMENT_CLASSES.map(x => 'wd:' + x).join(' ')} } ?item wdt:P31 ?cls } UNION { ?item wdt:P1435 ?h } UNION { ?item wdt:P757 ?w } ` +
      `?item wikibase:sitelinks ?links . MINUS { ?item wdt:P576 ?d } OPTIONAL { ?item wdt:P17 ?ctry . ?ctry wdt:P297 ?cc } ` +
      `OPTIONAL { ?item rdfs:label ?lab FILTER(LANG(?lab) = "${LANG}") } } GROUP BY ?item`;
    let ok = false;
    for (const ep of CONFIG.DISCOVERY.sparql) {
      try {
        const j = await getJSON(`${ep}?query=${encodeURIComponent(q)}`, 12000, {headers: {Accept: 'application/sparql-results+json'}});
        for (const b of j.results.bindings) {
          out.set(b.item.value.split('/').pop(), {l: parseInt(b.l && b.l.value, 10) || 0, cc: (b.c && b.c.value || '').slice(0, 2).toUpperCase(), label: b.label && b.label.value});
        }
        ok = true; break;
      } catch (e) { console.warn('sparql', ep, e.message); }
    }
    return ok;
  },
};

/* Histoire du monument : 2 premières phrases de Wikipédia dans la langue du joueur, mises en cache. */

    try {
      const ent = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${id}&props=sitelinks|descriptions&sitefilter=${LANG}wiki|enwiki&languages=${LANG}|en&format=json&origin=*`, 10000);

  async fill(el, id) {

  },

/* ===================== Progression ===================== */
function summary(s) {
  const cards = Object.entries(s.cards);
  return {nCards: cards.length, nCountries: Object.keys(s.countries).length,
    nLeg: cards.filter(([, c]) => rarityOf(c.m.l) === 'L').length, nBonus: cards.filter(([, c]) => c.bonus).length, best: s.streak.best || 0};
}
function levelInfo(score) {
  let i = 0; while (i + 1 < LEVELS.length && score >= LEVELS[i + 1]) i++;
  const names = t('levels');
  return {n: i + 1, title: names[i] || names[names.length - 1], nextTitle: names[i + 1], next: LEVELS[i + 1], pct: i + 1 < LEVELS.length ? (score - LEVELS[i]) / (LEVELS[i + 1] - LEVELS[i]) : 1};
}
// Album évolutif : son niveau dépend du nombre de cartes (TIERS) ; on affiche ce qu'il manque pour le suivant.
function albumInfo(n) {
  let i = 0; while (i + 1 < TIERS.length && n >= TIERS[i + 1]) i++;
  const names = t('tiers'), next = TIERS[i + 1];
  const sub = next ? t('tier_next', {n: fmt(next - n), t: names[i + 1]}) : t('tier_max');
  return {cls: 'album t' + i, html: `<span class="em">${['📒', '🥉', '🥈', '🥇', '💎'][i]}</span><div><b>${esc(names[i])}</b><span class="small muted">${esc(sub)}</span></div>`};
}
const earnedBadges = s => { const x = summary(s); return new Set(BADGES.filter(b => b.test(x)).map(b => b.id)); };
function updateStreak() {
  const td = today(), y = today(Date.now() - 864e5);
  if (S.streak.last === td) return;
  S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
  S.streak.last = td; S.streak.best = Math.max(S.streak.best || 0, S.streak.count);
}
const streakActive = () => (S.streak.last === today() || S.streak.last === today(Date.now() - 864e5)) ? S.streak.count : 0;
function computePoints(m, dist, isBonus) {
  const lines = [], r = mRar(m);
  const base = mPts(m) * (isBonus ? BONUS_RATIO : 1);
  lines.push(isBonus ? t('l_bonus', {p: fmt(base)}) : t('l_card', {r: t('r_' + r), p: fmt(base)}));
  let mult = 1;
  if (dist <= mRadius(m) / 2) { mult += PRECISION_BONUS; lines.push(t('l_prec')); }
  const st = Math.min(STREAK_MAX, (S.streak.count - 1) * STREAK_STEP);
  if (st > 0) { mult += st; lines.push(t('l_streak', {n: S.streak.count, p: Math.round(st * 100)})); }
  if (S.boostX2 > 0) { mult *= 2; S.boostX2--; lines.push(t('l_boost')); }
  return {pts: Math.round(base * mult), lines};
}

/* ===================== Géolocalisation ===================== */
const Geo = {
  pos: null, err: null, watchId: null, fake: false, subs: new Set(),
  start() {
    if (!navigator.geolocation) { this.fail({code: 0}); return; }
    if (this.watchId !== null) return;
    this.watchId = navigator.geolocation.watchPosition(p => this.set(p), e => this.fail(e), {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000});
  },
  set(p) {
    if (this.fake) return;
    this.err = null;
    this.pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ts: Date.now()};
    this.emit();
  },
  setFake(lat, lng) { this.fake = true; this.err = null; this.pos = {lat, lng, acc: 8, ts: Date.now()}; this.emit(); },
  fail(e) { this.err = e; this.emit(); },
  emit() { this.subs.forEach(f => f(this.pos, this.err)); },
  fresh() {
    if (this.fake) { this.pos.ts = Date.now(); return Promise.resolve(this.pos); }
    if (this.pos && Date.now() - this.pos.ts < 8000) return Promise.resolve(this.pos);
    if (!navigator.geolocation) return Promise.resolve(null);
    return new Promise(res => navigator.geolocation.getCurrentPosition(
      p => { this.set(p); res(this.pos); }, e => { this.fail(e); res(this.pos); },
      {enableHighAccuracy: true, maximumAge: 0, timeout: 15000}));
  },
  errText(e) {
    if (!navigator.geolocation) return t('gps_unsup');
    return e && e.code === 1 ? t('gps_denied') : e && e.code === 3 ? t('gps_slow') : t('gps_unavail');
  },
};
const quality = pos => !pos ? 'ko' : pos.acc <= 25 ? 'ok' : pos.acc <= CONFIG.GPS_MAX_ACCURACY_M ? 'warn' : 'ko';
function nearest(pos, limit, pred = () => true) {
  if (!pos) return [];
  const out = [];
  for (const m of Mons.all.values()) {
    if (Math.abs(m.lat - pos.lat) > 1 || !pred(m)) continue;  // pré-filtre rapide (~110 km)
    out.push({m, d: haversine(pos.lat, pos.lng, m.lat, m.lng)});
  }
  return out.sort((a, b) => a.d - b.d).slice(0, limit);
}
const bestTarget = pos => nearest(pos, 1, m => !(S.cards[m.id] && S.cards[m.id].bonus))[0] || nearest(pos, 1)[0];
/** Validation : position fraîche, précision acceptable, distance ≤ rayon + tolérance plafonnée, téléphone tourné vers le monument. */
function validate(m, pos, heading = null) {
  if (!pos) return {ok: false, msg: t('e_nogps')};
  if (Date.now() - pos.ts > CONFIG.GPS_MAX_AGE_MS) return {ok: false, msg: t('e_stale')};
  const dist = haversine(pos.lat, pos.lng, m.lat, m.lng);
  if (pos.acc > CONFIG.GPS_MAX_ACCURACY_M) return {ok: false, dist, msg: t('e_acc', {a: fmt(pos.acc)})};
  if (dist - Math.min(pos.acc, CONFIG.GPS_TOLERANCE_CAP_M) > mRadius(m)) return {ok: false, dist, msg: t('e_far', {d: fmtDist(dist), n: mName(m), r: fmtDist(mRadius(m))})};
  if (heading !== null && dist > CONFIG.HEADING_SKIP_M && angleDiff(heading, bearing(pos.lat, pos.lng, m.lat, m.lng)) > CONFIG.HEADING_TOLERANCE_DEG) {
    return {ok: false, dist, msg: t('e_aim')};
  }
  return {ok: true, dist, acc: pos.acc};
}
function bearing(lat1, lng1, lat2, lng2) {
  const r = Math.PI / 180, dl = (lng2 - lng1) * r;
  const y = Math.sin(dl) * Math.cos(lat2 * r), x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

/* Boussole : direction visée par l'appareil photo arrière, pour vérifier que le monument est dans le cadre. */
const Compass = {
  heading: null, ts: 0, on: false,
  // À appeler pendant un geste du joueur (iPhone : demande d'autorisation).
  async start() {
    if (this.on || typeof DeviceOrientationEvent === 'undefined') return;
    this.on = true;
    try { if (typeof DeviceOrientationEvent.requestPermission === 'function' && (await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch (e) { return; }
    const h = e => {
      let v = null;
      if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) v = e.webkitCompassHeading;  // iPhone
      else if (e.absolute && e.alpha !== null) v = rearHeading(e.alpha, e.beta, e.gamma);                           // Android
      if (v === null || isNaN(v)) return;
      this.heading = v; this.ts = Date.now();
      if ($('#cam').classList.contains('on')) Cam.onAim();
    };
    window.addEventListener('deviceorientationabsolute', h);
    window.addEventListener('deviceorientation', h);
  },
  // Cap récent, sinon null (ordinateur, autorisation refusée) : la visée n'est alors pas exigée.
  get() { return this.heading !== null && Date.now() - this.ts < 3000 ? this.heading : null; },
};
// Cap de la caméra arrière à partir des angles du téléphone (formule de la spécification W3C DeviceOrientation).
function rearHeading(alpha, beta, gamma) {
  const r = Math.PI / 180, x = (beta || 0) * r, y = (gamma || 0) * r, z = (alpha || 0) * r;
  const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
  const vx = -cZ * sY - sZ * sX * cY, vy = -sZ * sY + cZ * sX * cY;
  let h = Math.atan(vx / vy);
  if (vy < 0) h += Math.PI; else if (vx < 0) h += 2 * Math.PI;
  return h / r;
}

/* ===================== Alertes pour le créateur ===================== */
const Notify = {
  send(kind, msg) {
    const n = CONFIG.NOTIFY;
    if (!n.url || !n[kind] || ['localhost', '127.0.0.1'].includes(location.hostname)) return;
    // Robots (Google, captures d'écran de Netlify…) : ce ne sont pas de vrais joueurs.
    if (navigator.webdriver || /bot|crawl|spider|slurp|headless|lighthouse|preview|screenshot/i.test(navigator.userAgent)) return;
    fetch(n.url, {method: 'POST', body: msg, keepalive: true}).catch(() => {});
  },
  // Une seule alerte par appareil pour un même évènement (mémorisé à part de la sauvegarde du joueur).
  once(kind, msg) {
    let seen = {};
    try { seen = JSON.parse(localStorage.getItem('mdm_notified')) || {}; } catch (e) {}
    if (seen[kind]) return;
    seen[kind] = Date.now();
    try { localStorage.setItem('mdm_notified', JSON.stringify(seen)); } catch (e) { return; }
    this.send(kind, msg);
  },
  device: () => IS_IOS ? 'iPhone' : IS_ANDROID ? 'Android' : 'ordinateur',
  // Sur iPhone, l'appli installée a sa propre mémoire : on n'y recompte pas un « nouveau visiteur ».
  visit() {
    if (isStandalone()) this.once('install', `📲 Jeu installé sur l'écran d'accueil (${this.device()})`);
    else this.once('visit', `👋 Nouveau visiteur (${this.device()}, langue ${LANG})`);
  },
  capture(m, isBonus) {
    const r = I18N.fr['r_' + rarityOf(m.l)] || '';
    this.send('capture', `📸 ${isBonus ? 'Photo bonus' : 'Carte capturée'} · ${r} · ${flag(m.cc)} ${m.cc || ''} (${Object.keys(S.cards).length} carte(s) pour ce joueur)`);
  },
};

/* ===================== Attribution des cartes ===================== */
const Game = {
  async award(m, blob, v) {
    const card = S.cards[m.id];
    if (card && card.bonus) { toast(t('already')); return; }
    const isBonus = !!card, key = isBonus ? m.id + ':bonus' : m.id;
    // La photo est enregistrée AVANT la carte : jamais de carte sans photo validée.
    try { await DB.put('photos', key, blob); } catch (e) { alert(t('e_store')); return; }
    Photos.drop(key);
    const before = earnedBadges(S);
    updateStreak();
    const {pts, lines} = computePoints(m, v.dist, isBonus);
    const now = Date.now();
    if (isBonus) card.bonus = {at: now, pts, dist: Math.round(v.dist)};
    else S.cards[m.id] = {at: now, pts, dist: Math.round(v.dist), acc: Math.round(v.acc), bonus: null, cover: 'main', m: snapshot(m)};
    // Avec un profil, mêmes pièces que le serveur : selon les points de base (sans série ni boost).
    let coins = Net.profile ? coinsFor(Math.round(mPts(m) * (isBonus ? BONUS_RATIO : 1))) : coinsFor(pts), extra = 0;
    if (!isBonus && m.cc && !S.countries[m.cc]) {
      S.countries[m.cc] = now; extra = COUNTRY_BONUS_PTS; if (!Net.profile) coins += COUNTRY_BONUS_COINS;
      lines.push(t('l_country', {c: flag(m.cc) + ' ' + countryName(m.cc), p: fmt(COUNTRY_BONUS_PTS)}));
    }
    S.score += pts + extra; S.coins += coins; S.captureCount++;
    const after = earnedBadges(S);
    const newBadges = BADGES.filter(b => after.has(b.id) && !before.has(b.id));
    save();
    UI.refreshAll(); MapView.refreshMarker(m.id);
    sound('win'); vibrate([60, 40, 120]);
    Reveal.show(m, {pts: pts + extra, coins, lines, isBonus, newBadges});
    Notify.capture(m, isBonus);
    Net.capture(m, v, isBonus);
  },
};

const Regions = {
  data: null,
  async init() { try { this.data = await getJSON(CONFIG.REGIONS_URL, 20000); } catch (e) { console.warn('regions', e); } },
  // Code pays du point (frontières simplifiées à ~400 m près), ou null.
  at(lat, lng) {
    if (!this.data) return null;
    for (const f of this.data.features) {
      for (const poly of f.geometry.coordinates) {
        if (inRing(lng, lat, poly[0]) && !poly.slice(1).some(h => inRing(lng, lat, h))) return f.properties.cc;
      }
    }
    return null;
  },
  playable(lat, lng) { const cc = this.at(lat, lng); return !this.data || !cc || CONFIG.COUNTRIES.includes(cc); },
};
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

const SOON_LABELS = {BE: [4.6, 50.6], LU: [6.1, 49.75], DE: [10.2, 51.1], CH: [8.2, 46.8], IT: [12.5, 42.9], ES: [-3.6, 40.3], AD: [1.55, 42.55]};

function loadMapLibre() {
  return new Promise(res => {
    if (window.maplibregl) return res(true);
    let done = false; const fin = ok => { if (!done) { done = true; res(ok); } };
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = CONFIG.MAPLIBRE_CSS; css.crossOrigin = 'anonymous';
    document.head.appendChild(css);
    const s = document.createElement('script'); s.src = CONFIG.MAPLIBRE_JS; s.crossOrigin = 'anonymous';
    s.onload = () => fin(!!window.maplibregl); s.onerror = () => fin(false);
    document.head.appendChild(s);
    setTimeout(() => fin(!!window.maplibregl), 15000);
  });
}
// Cercle géographique en polygone : zone de précision du joueur, colonnes de lumière des monuments.
function circlePoly(lng, lat, radiusM, n = 24) {
  const ring = [], dLat = radiusM / 111320, dLng = dLat / Math.cos(lat * Math.PI / 180);
  for (let i = 0; i <= n; i++) { const a = i / n * 2 * Math.PI; ring.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]); }
  return [ring];
}
const fc = features => ({type: 'FeatureCollection', features});
const point = (lng, lat, properties = {}) => ({type: 'Feature', geometry: {type: 'Point', coordinates: [lng, lat]}, properties});
// Effets de rareté : colonne de lumière en 3D (largeur et hauteur en mètres) et halo qui pulse.
const BEAM = {L: {w: 10, h: 260}};
const rarityColor = ['match', ['get', 'r'], 'U', RARITY.U.color, 'R', RARITY.R.color, 'E', RARITY.E.color, 'L', RARITY.L.color, RARITY.C.color];

const MapView = {
  map: null, ready: false, centered: false, timer: null, discTimer: null, popup: null, orbitRaf: 0,
  errs: [], tries: 0, lost: false, animating: false, t0: 0, regionsReady: null, watchT: 0, reportOk: false,
  builds: 0, lostN: 0, blankTries: 0, lostReported: false, mode: 0, builtAt: 0, lostAtStart: false, healed: 0,
  // regionsReady : frontières des pays (attendues 5 s au plus). La carte n'attend plus les monuments.
  async init(regionsReady) {
    this.t0 = Date.now(); this.regionsReady = regionsReady || Promise.resolve();
    try { localStorage.removeItem('mdm_mapmode'); } catch (e) {}  // ancien réglage de la v2.7.4
    this.watch();
    // iPhone : en arrière-plan, iOS peut retirer l'accès à la 3D ; s'il ne le rend pas au retour, on recrée la carte.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(() => this.revive(), 3000); });
    // Téléphone sans 3D constaté il y a moins de 24 h : on ouvre directement la carte 2D (bouton « 3D » pour réessayer).
    let noGL = 0;
    try { noGL = +localStorage.getItem('mdm_flat') || 0; } catch (e) {}
    if (Date.now() - noGL < 864e5) return this.fallback('mémorisé');
    if (!(await loadMapLibre())) return this.fallback('réseau');
    try { this.build(); } catch (e) { console.error(e); noteErr(e.message); this.fallback('3d'); }
  },
  build(cam) {
    // Modes de secours (si la 3D refuse de démarrer) : 1 = ancienne version de la 3D (WebGL 1), 2 = idem en basse définition.
    const proto = HTMLCanvasElement.prototype, getCtx = proto.getContext;
    if (this.mode >= 1) proto.getContext = function (type, attrs) { return type === 'webgl2' ? null : getCtx.call(this, type, attrs); };
    let map;
    try {
      map = this.map = new maplibregl.Map({
        container: 'map', style: CONFIG.MAP_STYLE, center: [2.4, 46.6], zoom: 5, minZoom: 3.5, maxPitch: 75, ...(cam || {}),
        pixelRatio: Math.min(window.devicePixelRatio || 1, this.mode >= 2 ? 1 : 2),  // l'iPhone limite fort la mémoire 3D : ×2 suffit
        attributionControl: {compact: true, customAttribution: 'Wikidata'},
      });
    } finally { proto.getContext = getCtx; }
    this.builtAt = Date.now();
    map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'top-left');
    map.on('error', e => {
      const msg = String(e.error && e.error.message || e.error || 'erreur');
      this.errs.push(msg.slice(0, 90)); if (this.errs.length > 3) this.errs.shift();
      if (!this.ready && /webgl/i.test(msg)) this.fallback('3d');
    });
    this.builds++;
    const cv = map.getCanvas();
    // (une carte qu'on supprime perd aussi sa 3D, volontairement : seule la carte affichée compte)
    cv.addEventListener('webglcontextlost', () => {

      this.lost = true; this.lostN++;

      // Jeu à l'écran (pas en arrière-plan) : anormal, on le signale une fois.
      if (!document.hidden && !this.lostReported) { this.lostReported = true; Notify.send('mapfail', `⚠️ 3D perdue pendant le jeu · ${this.diag()}`); }
      setTimeout(() => this.revive(), 3000);

  popupHTML(m) {
    const c = S.cards[m.id], r = mRar(m), d = Geo.pos ? haversine(Geo.pos.lat, Geo.pos.lng, m.lat, m.lng) : null;
    return `<div class="pop"><span class="badge-r ${r}">${RARITY[r].icon} ${esc(t('r_' + r))} · ${fmt(mPts(m))} ${esc(t('pts'))}</span>

      <div class="small" style="margin:6px 0">${esc(c ? (c.bonus ? t('p_done') : t('p_got')) : t('p_locked'))}</div>
      <div class="row">${!(c && c.bonus) ? `<button class="btn gold sm" data-act="photo" data-id="${m.id}">📸</button>` : ''}<button class="btn sm" data-act="detail" data-id="${m.id}">${esc(t('b_detail'))}</button></div></div>`;
  },
  openPopup(m) {

  closePopup() { if (Flat.on) Flat.closePopup(); if (this.popup) { this.popup.remove(); this.popup = null; } },
  goTo(lat, lng) {

  resize() { if (Flat.on) Flat.resize(); else if (this.map) this.map.resize(); },

    this.map.getSource('me-acc').setData(fc([{type: 'Feature', geometry: {type: 'Polygon', coordinates: circlePoly(pos.lng, pos.lat, pos.acc, 48)}, properties: {}}]));

  focus(id) {

    const lm = window.Landmarks && Landmarks.get(id);  // un monument modélisé en 3D est cadré en entier

    ['mousedown', 'touchstart', 'wheel'].forEach(ev => map.on(ev, stop));

  locate() {

  // Pas de carte 3D. why : '3d' (refusée par le téléphone), 'réseau' (moteur non chargé) ou 'mémorisé'.
  // On ouvre la carte 2D de secours ; la liste des monuments seulement si la 2D ne se charge pas non plus.
  async fallback(why) {
    if (this.falling) return;
    this.falling = true;
    clearTimeout(this.watchT); clearTimeout(this.blankT); this.reportOk = false; this.ready = false;
    let cam = null;
    try { if (this.map) { const c = this.map.getCenter(); cam = {lat: c.lat, lng: c.lng, zoom: this.map.getZoom()}; } } catch (e) {}
    this.friendMarkers.forEach(mk => mk.remove()); this.friendMarkers.clear();
    if (this.map) { try { this.map.remove(); } catch (e) {} this.map = null; }

    if (why === '3d') { try { localStorage.setItem('mdm_flat', Date.now()); } catch (e) {} }
    const flat = await Flat.start(cam);
    if (flat) {
      $('#map-list').classList.add('hidden'); $('#btn-locate').classList.remove('hidden'); $('#btn-3d').classList.remove('hidden');

    } else {
      $('#map-list').classList.remove('hidden'); $('#btn-locate').classList.add('hidden');
      this.renderList();
      if (why !== 'mémorisé') toast(t('map_list'), 7000);
    }
    if (why !== 'mémorisé') Notify.send('mapfail', `${flat ? '🟦 Carte 2D de secours affichée' : '📋 Liste des monuments affichée'} (${why}) · ${this.diag()}`);
  },
  // Boutons « 3D » (carte 2D) et « Réessayer la carte » (liste) : on retente la vraie carte.
  async retry() {

    if (!window.maplibregl && !(await loadMapLibre())) return this.fallback('réseau');
    this.rebuild();
  },
  renderList() {
    if ($('#map-list').classList.contains('hidden')) return;
    $('#near-list').innerHTML = nearest(Geo.pos, 60).map(({m, d}) => {
      const c = S.cards[m.id], r = mRar(m);
      return `<div class="item"><div class="grow"><b>${esc(mName(m))} ${c ? (c.bonus ? '✅✅' : '✅') : ''}</b>
        <span class="small muted">${fmtDist(d)}</span> <span class="badge-r ${r}">${esc(t('r_' + r))}</span></div>
        <button class="btn sm" data-act="detail" data-id="${m.id}">${esc(t('b_detail'))}</button>${!(c && c.bonus) ? `<button class="btn gold sm" data-act="photo" data-id="${m.id}">📸</button>` : ''}</div>`;
    }).join('') || `<p class="muted">${esc(Geo.pos ? '—' : t('searching'))}</p>`;
  },
};

/* ===================== Carte 2D de secours (sans 3D) ===================== */
// Pour les téléphones qui refusent la 3D (WebGL) : carte plate Leaflet, fond OpenStreetMap (usage léger, auteurs cités).
// Les niveaux de zoom de Leaflet comptent un cran de plus que ceux de la carte 3D : z3D = z2D − 1.
const Flat = {
  map: null, on: false, pins: null, me: null, acc: null, popup: null, friends: new Map(), timer: null, icons: {}, centered: false,
  CSS: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
  JS: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  load() {
    return new Promise(res => {
      if (window.L && L.map) return res(true);
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = this.CSS; css.crossOrigin = 'anonymous';
      document.head.appendChild(css);
      const s = document.createElement('script'); s.src = this.JS; s.crossOrigin = 'anonymous';
      s.onload = () => res(!!(window.L && L.map)); s.onerror = () => res(false);
      document.head.appendChild(s);
      setTimeout(() => res(!!(window.L && L.map)), 15000);
    });
  },
  // cam : {lat, lng, zoom} en niveaux de la carte 3D (repris de la carte 3D quand elle existait).
  async start(cam) {
    if (this.on) return true;
    if (!(await this.load())) return false;
    const el = $('#map2d');
    el.classList.remove('hidden');
    const c = cam || (Geo.pos ? {lat: Geo.pos.lat, lng: Geo.pos.lng, zoom: 16} : {lat: 46.6, lng: 2.4, zoom: 5});
    const map = this.map = L.map(el, {minZoom: 4, maxZoom: 19, worldCopyJump: true, zoomSnap: 0.5}).setView([c.lat, c.lng], c.zoom + 1);
    map.attributionControl.setPrefix(false);

      maxZoom: 19, crossOrigin: 'anonymous', attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Wikidata',
    }).addTo(map);
    // Frontières : pays jouables en doré, voisins « bientôt » grisés et étiquetés.
    if (Regions.data) {
      L.geoJSON(Regions.data, {interactive: false, style: f => {
        const cc = f.properties.cc;
        return CONFIG.COUNTRIES.includes(cc) ? {color: RARITY.L.color, weight: 2.5, opacity: 0.9, fill: false}
          : CONFIG.SOON.includes(cc) ? {stroke: false, fillColor: '#5f6368', fillOpacity: 0.12} : {stroke: false, fill: false};
      }}).addTo(map);
      for (const cc of CONFIG.SOON) if (SOON_LABELS[cc]) {
        L.marker([SOON_LABELS[cc][1], SOON_LABELS[cc][0]], {interactive: false, keyboard: false, icon: L.divIcon({className: 'mk2d', iconSize: null,
          html: `<div class="soon-tag" style="transform:translate(-50%,-50%)">🔒 ${flag(cc)} ${esc(countryName(cc))} · ${esc(t('soon'))}</div>`})}).addTo(map);
      }
    }
    this.pins = L.layerGroup().addTo(map);
    map.on('moveend', () => {
      const z = map.getZoom() - 1, ctr = map.getCenter();
      if (z >= 7) Data.bounds(map.getBounds()).then(n => { if (n) this.schedule(); });
      if (z >= 14 && Regions.playable(ctr.lat, ctr.lng)) {
        clearTimeout(MapView.discTimer);
        MapView.discTimer = setTimeout(() => Discover.maybe(ctr.lat, ctr.lng), 1500);
      }
      this.schedule();
    });

  },
  stop() {

    this.friends.clear();
    $('#map2d').classList.add('hidden');
  },
  // Épingle en goutte (même dessin que la carte 3D) ; halo qui pulse pour les monuments épiques et légendaires.
  icon(r, st) {
    const k = r + st;

      const halo = r === 'E' || r === 'L' ? `<span class="halo2d" style="--c:${RARITY[r].color}"></span>` : '';
      this.icons[k] = L.divIcon({className: 'mk2d pin2d', iconSize: [28, 38], iconAnchor: [14, 38], popupAnchor: [0, -34],
        html: `${halo}<img src="${MapView.pinCanvas(r, st).toDataURL()}" alt="">`});
    }

  },
  // Grand monument en pixel art, à la taille du zoom (z : niveau de la carte 3D).
  artIcon(m, r, st, z) {
    const a = Sprites.meta(m.id), s = Sprites.scale(z), w = Math.round(a.w * s), h = Math.round(a.h * s);

  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.render(), 120); },
  render() {

        if (placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) continue;
        placed.push(box);
      }
      L.marker([m.lat, m.lng], {icon: art ? this.artIcon(m, r, st, z) : this.icon(r, st), keyboard: false, zIndexOffset: art ? 2000 : RARITY_KEYS.indexOf(r) * 200})
        .on('click', () => this.openPopup(m)).addTo(this.pins);
    }
  },
  updateMe(pos) {
    if (!this.on || !pos) return;
    const ll = [pos.lat, pos.lng];
    if (!this.me) {
      this.acc = L.circle(ll, {radius: pos.acc, stroke: false, fillColor: '#2b8cff', fillOpacity: 0.14, interactive: false}).addTo(this.map);
      this.me = L.marker(ll, {interactive: false, keyboard: false, zIndexOffset: 5000,
        icon: L.divIcon({className: 'mk2d', iconSize: [24, 24], iconAnchor: [12, 12], html: '<div class="me-dot"></div>'})}).addTo(this.map);
    } else { this.me.setLatLng(ll); this.acc.setLatLng(ll).setRadius(pos.acc); }

  },
  openPopup(m) {
    if (!this.on || !m) return;
    this.popup = L.popup({offset: [0, -32], maxWidth: 300, className: 'pop2d', autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: [10, 110]})
      .setLatLng([m.lat, m.lng]).setContent(MapView.popupHTML(m)).openOn(this.map);
  },
  closePopup() { if (this.on) this.map.closePopup(); this.popup = null; },
  focus(m) {
    if (!this.on || !m) return;
    this.map.flyTo([m.lat, m.lng], 18, {duration: 1.2});
    this.map.once('moveend', () => { this.render(); this.openPopup(m); });
  },
  goTo(lat, lng) { if (this.on) this.map.flyTo([lat, lng], 17, {duration: 1.2}); },
  locate() {
    if (Geo.pos) this.map.flyTo([Geo.pos.lat, Geo.pos.lng], 17, {duration: 1});
    else { Geo.start(); toast(t('searching')); }
  },
  refreshData() {
    if (!this.on) return;
    if (this.map.getZoom() - 1 >= 7) Data.bounds(this.map.getBounds()).then(n => { if (n) this.schedule(); });
    this.schedule();
  },
  resize() { if (this.on) this.map.invalidateSize(); },
  // Amis sur la carte (position floutée par le serveur), comme sur la carte 3D.
  updateFriends(list) {
    if (!this.on) return;
    const keep = new Set();
    for (const f of list || []) {
      keep.add(f.id);
      let mk = this.friends.get(f.id);
      if (!mk) {
        mk = L.marker([f.lat, f.lng], {keyboard: false, zIndexOffset: 4000, icon: L.divIcon({className: 'mk2d', iconSize: null,
          html: `<div class="fmark" style="transform:translate(-50%,-100%)"><img src="${drawAvatar(f.avatar, 64)}" alt=""><span>${esc(f.pseudo)}</span></div>`})})
          .on('click', () => Social.openPlayer(f.id)).addTo(this.map);
        this.friends.set(f.id, mk);

  },
};

const AV = {

  hairc: ['#2c1b10', '#5a3825', '#a0522d', '#d8b04a', '#ece4cf', '#b03030', '#3b6bff', '#ff7ac8'],

  return rtf.format(0, 'second');
};
// Fin de la semaine de compétition : lundi 0 h (heure du téléphone, comme le serveur en France).
function weekLeft() {
  const d = new Date(), end = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7) + 7);
  const ms = end - d, h = Math.floor(ms / 36e5);
  return h >= 24 ? t('cp_left_d', {d: Math.floor(h / 24), h: h % 24}) : t('cp_left_h', {h, m: Math.floor(ms % 36e5 / 6e4)});
}

/* ===================== Serveur (Supabase) : comptes, amis, compétition ===================== */
// Client minimal sans bibliothèque : compte anonyme créé à la création du profil, jeton rafraîchi, appels de fonctions.
const Net = {
  sess: null, profile: null, unread: 0, timer: null, inflight: null, flushing: false,
  enabled: () => !!(CONFIG.SUPABASE.url && CONFIG.SUPABASE.anonKey),
  load() { try { this.sess = JSON.parse(localStorage.getItem('mdm_session')); } catch (e) { this.sess = null; } },
  store(s) {
    this.sess = s ? {at: s.access_token, rt: s.refresh_token, exp: Date.now() + (s.expires_in - 60) * 1000} : null;
    try { localStorage.setItem('mdm_session', JSON.stringify(this.sess)); } catch (e) {}
  },
  async auth(path, body) {
    const c = CONFIG.SUPABASE;
    const r = await fetch(`${c.url}/auth/v1/${path}`, {method: 'POST', headers: {apikey: c.anonKey, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) { const e = new Error('auth ' + r.status); e.status = r.status; throw e; }
    return r.json();
  },
  // Jeton valide ; un seul renouvellement à la fois. Sans session, crée le compte (anonyme) du joueur.
  token() {
    if (this.sess && Date.now() < this.sess.exp) return Promise.resolve(this.sess.at);
    if (!this.inflight) {
      this.inflight = (async () => {
        if (this.sess) {
          try { this.store(await this.auth('token?grant_type=refresh_token', {refresh_token: this.sess.rt})); return this.sess.at; }
          catch (e) { if (!(e.status >= 400 && e.status < 500)) throw e; }  // session révoquée : nouveau compte
        }
        this.store(await this.auth('signup', {data: {}}));
        return this.sess.at;
      })().finally(() => { this.inflight = null; });
    }
    return this.inflight;
  },
  async call(method, path, body) {
    const c = CONFIG.SUPABASE;
    const r = await fetch(`${c.url}/rest/v1/${path}`, {method, body: body ? JSON.stringify(body) : undefined,
      headers: {apikey: c.anonKey, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json'}});
    const txt = await r.text(); let j = null;
    try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    // 400 = règle du jeu refusée par le serveur (définitif) ; le reste (réseau, 401, 5xx) peut être réessayé.
    if (!r.ok) { const e = new Error((j && j.message) || 'http ' + r.status); e.server = r.status === 400; throw e; }
    return j;
  },
  rpc(fn, args = {}) { return this.call('POST', 'rpc/' + fn, args); },
  // Bonus du jour donné par le serveur (une fois par jour, heure de Paris).
  daily() {
    if (!this.profile) return;
    this.rpc('wallet_daily', {p_pass: has('pass')}).then(r => {
      S.coins = r.coins;
      if (r.given) { S.lastDaily = today(); if (has('pass')) S.boostX2++; toast(t('daily', {c: has('pass') ? 40 : 20})); }
      save(); UI.refreshHeader();
    }).catch(() => {});
  },
  // Photo de la carte envoyée en petit format (720 px) : visible des amis et nécessaire pour la vendre.
  async uploadPhoto(id) {
    const blob = await DB.get('photos', id);
    if (!blob) throw new Error('photo locale absente');
    const img = await createImageBitmap(blob), k = Math.min(1, 720 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const small = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.8));
    const c = CONFIG.SUPABASE, path = `${this.uid()}/${id}-${Date.now()}.jpg`;
    const r = await fetch(`${c.url}/storage/v1/object/cards/${path}`, {method: 'POST', body: small,
      headers: {apikey: c.anonKey, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'image/jpeg'}});
    if (!r.ok) throw new Error('envoi photo ' + r.status);
    await this.rpc('set_card_photo', {p_monument: id, p_path: path});
    return path;
  },
  // Cartes vendues à la bourse : retirées de la collection du vendeur (les pièces sont déjà sur son compte).
  sold(list) {
    for (const x of list) {
      const c = S.cards[x.monument];
      toast(t('mk_sold', {n: c ? mName({id: x.monument, ...c.m}) : x.monument, p: fmt(x.price)}), 4500);
      delete S.cards[x.monument];
    }
    save(); UI.refreshAll(); MapView.scheduleRender();
    if (UI.current === 'market') Market.render();
    this.rpc('market_seen', {p_ids: list.map(x => x.id)}).catch(() => {});
  },
  uid() { try { return JSON.parse(atob(this.sess.at.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) { return null; } },
  async start() {
    if (!this.enabled()) return;
    this.load();
    if (this.sess && navigator.onLine) {
      try {
        await this.token();
        this.profile = (await this.call('GET', `profiles?id=eq.${this.uid()}&select=*`))[0] || null;
      } catch (e) { console.warn('net', e.message); }
    }
    Social.refresh();
    if (this.profile) this.afterLogin();
  },
  async afterLogin() {
    Social.refresh();
    Cloud.push();
    $('#btn-delete-account').classList.remove('hidden');
    // Les pièces passent sur le serveur (celles gagnées avant le profil sont reprises, plafonnées).
    try { S.coins = await this.rpc('wallet_open', {p_local: S.coins}); save(); UI.refreshHeader(); } catch (e) { console.warn('wallet', e.message); }
    this.daily();
    if (S.pendingInvite) {
      const code = S.pendingInvite; S.pendingInvite = null; save();
      const r = await this.rpc('accept_invite', {p_code: code}).catch(() => null);
      if (r && r.pseudo) toast(t('fr_now', {p: r.pseudo}), 4000);
    }
    this.flush();
    Push.sync();
    this.rpc('claim_rewards').then(rw => { if (rw && rw.length) Social.showRewards(rw); }).catch(() => {});
    clearInterval(this.timer);
    this.timer = setInterval(() => { if (!document.hidden && navigator.onLine) this.sync(); }, CONFIG.SUPABASE.syncEveryS * 1000);
    this.sync();
  },
  // Toutes les ~20 s : position floue envoyée, amis sur la carte, notifications non lues, captures en attente.
  async sync() {
    if (!this.profile) return;
    await this.flush();
    const p = Geo.pos && !Geo.fake && Date.now() - Geo.pos.ts < 120000 ? Geo.pos : null;
    try {
      const r = await this.rpc('sync', p ? {p_lat: p.lat, p_lng: p.lng} : {});
      if ((r.unread > (this.unread || 0) || r.msgs > (this.msgs || 0)) && this.synced) Push.ask();
      this.unread = r.unread; this.msgs = r.msgs; this.synced = true;
      if (typeof r.wallet === 'number' && r.wallet !== S.coins) { S.coins = r.wallet; save(); UI.refreshHeader(); }
      if (r.sold && r.sold.length) this.sold(r.sold);
      Social.badge(); MapView.updateFriends(r.friends);
    } catch (e) { console.warn('sync', e.message); }
  },
  // Capture validée dans le jeu : envoyée au serveur (qui revérifie et compte les points de la compétition).
  capture(m, v, isBonus) {
    if (!this.profile || !v.pos) return;
    S.outbox = S.outbox || [];
    S.outbox.push({id: m.id, lat: v.pos.lat, lng: v.pos.lng, acc: v.pos.acc, bonus: isBonus, at: new Date(v.pos.ts).toISOString(), mlat: m.lat, mlng: m.lng, name: mName(m)});
    save(); this.flush();
  },
  async flush() {
    if (!this.profile || this.flushing || !(S.outbox || []).length || !navigator.onLine) return;
    this.flushing = true;
    try {
      while (S.outbox.length) {
        const c = S.outbox[0];
        try {
          const res = await this.rpc('record_capture', {p_monument: c.id, p_lat: c.lat, p_lng: c.lng, p_acc: c.acc, p_bonus: c.bonus, p_at: c.at, p_mlat: c.mlat, p_mlng: c.mlng, p_name: c.name});
          if (typeof res.coins === 'number') { S.coins = res.coins; UI.refreshHeader(); }
          if (!c.bonus) this.uploadPhoto(c.id).catch(e => console.warn('photo', e.message));
        } catch (e) {
          if (!e.server) break;  // hors-ligne : on réessaiera à la prochaine synchronisation
          console.warn('capture refusée par le serveur', c.id, e.message);
        }
        S.outbox.shift(); save();
      }
    } finally { this.flushing = false; }
  },
};

        return `<div class="prow" ${n.kind.startsWith('market') ? 'data-sact="go-market"' : n.kind === 'week_end' ? 'data-sact="go-compet"' : d.from ? `data-sact="player" data-id="${d.from}"` : ''} style="${n.read ? 'opacity:.7' : ''}"><span style="font-size:22px">${icon[n.kind] || '🔔'}</span>

  },
  // Récompenses des semaines passées : pièces, et couronne d'avatar pour le podium.
  showRewards(list) {
    S.trophies = S.trophies || {};
    // Les pièces sont créditées par le serveur ; la synchronisation met le solde à jour.
    for (const r of list) S.trophies[r.tier] = (S.trophies[r.tier] || 0) + 1;

      <p style="font-size:18px">${esc(t('rw_line', {r: r.rank, n: r.players, c: fmt(r.coins)}))}</p>`).join('') + (crown ? `<p><b>${esc(t('rw_crown'))}</b></p>` : '');
    openModal('m-reward'); sound('win');
  },
  async act(a, el) {
    const id = el.dataset.id;
    switch (a) {
      case 'acc-edit': this.openAccount(); break;
      case 'acc-save': this.saveAccount(); break;
      case 'acc-later': closeModal('m-account'); break;
      case 'av': if (el.disabled) return; this.draft[el.dataset.k] = +el.dataset.v; this.renderBuilder(); break;
      case 'av-rand': this.draft = {...avRandom(), a: this.draft.a === AV.CROWN ? 0 : this.draft.a}; this.renderBuilder(); break;
      case 'fr-add': this.addFriend($('#fr-input').value.trim()); break;
      case 'fr-add-p': await this.addFriend(el.dataset.p); this.openPlayer(Social.lastPlayer); break;
      case 'fr-accept': case 'fr-decline':
        try {
          await Net.rpc('friend_respond', {p_user: id, p_accept: a === 'fr-accept'});
          el.closest('.row, .prow').querySelectorAll('button').forEach(b => { b.disabled = true; });
          toast(t(a === 'fr-accept' ? 'fr_accepted' : 'fr_declined'));
          if (this.seg === 'friends') this.renderFriends();
        } catch (e) { toast(netErr(e)); }
        break;
      case 'fr-remove':
        if (!confirm(t('fr_remove') + ' ?')) return;
        try { await Net.rpc('friend_remove', {p_user: id}); closeModal('m-player'); if (this.seg === 'friends') this.renderFriends(); } catch (e) { toast(netErr(e)); }
        break;
      case 'player': closeModal('m-notifs'); this.openPlayer(id); break;
      case 'chat': Chat.open(id, el.dataset.p); break;
      case 'chat-send': Chat.send(); break;
      case 'chat-block': Chat.block(); break;
      case 'chat-report': Chat.report(); break;
      case 'go-market': closeModal('m-notifs'); Market.seg = 'mine'; UI.tab('market'); break;
      case 'pp-enable':
        closeModal('m-push');
        if (Push.state() === 'install') Install.open(); else Push.enable().then(() => Push.renderSetting());
        break;
      case 'pp-later': closeModal('m-push'); break;
      case 'go-compet': closeModal('m-notifs'); Social.seg = 'compet'; UI.tab('profile'); break;
      case 'push-on': Push.enable().then(ok => { if (ok) this.setSeg(this.seg); }); break;
      case 'invite': invite(); break;
      case 'board': this.board = el.dataset.v; this.renderCompet(); break;
      case 'focus':
        closeModal('m-player'); closeModal('m-listing');
        if (Mons.get(id)) MapView.focus(id);
        else { UI.tab('map'); MapView.goTo(+el.dataset.lat, +el.dataset.lng); }
        break;
    }
  },
};
document.addEventListener('click', e => {
  const seg = e.target.closest('#p-seg [data-seg]');
  if (seg) return Social.setSeg(seg.dataset.seg);
  // closest() prend l'élément le plus proche : un bouton dans une ligne cliquable garde sa propre action.
  const el = e.target.closest('[data-sact]');
